    keyCounts[k.id] = points.filter(pt => pt.keyMoments?.includes(k.id)).length;
  });

  // 關鍵分模式顯示的分
  const keyPoints = keyFilter
    ? points.filter(pt => pt.keyMoments?.includes(keyFilter))
    : points.filter(pt => pt.keyMoments?.length > 0);

  // 全部模式顯示的分（不受篩選影響）
  const allPoints = points;

  const gameScoreStr = (g, tiebreak) => {
    if (!g) return "0-0";
    if (tiebreak) return `${g.p1}-${g.p2}`;
    const s1 = SCORE_SEQ[g.p1] ?? "AD";
    const s2 = SCORE_SEQ[g.p2] ?? "AD";
    if (g.p1 >= 3 && g.p2 >= 3) {
      if (g.p1 === g.p2) return "Deuce";
      return g.p1 > g.p2 ? "Ad A" : "Ad B";
    }
    return `${s1}-${s2}`;
  };

  const setScoreStr = (sets, currentSet) => {
    const parts = [...(sets ?? []).map(s => `${s.p1}-${s.p2}`), `${currentSet?.p1 ?? 0}-${currentSet?.p2 ?? 0}`];
    return parts.join("  ");
  };

  return (
    <div style={{ paddingBottom: "1rem" }}>

      {/* 模式切換 */}
      <div style={{ display:"flex", gap:"0.5rem", marginBottom:"0.8rem" }}>
        <button onClick={() => setMode("all")}
          style={{ flex:1, padding:"0.5rem", borderRadius:"8px", border:`1.5px solid ${mode==="all"?"#7b9cff":"rgba(255,255,255,0.1)"}`, background: mode==="all"?"rgba(123,156,255,0.12)":"transparent", color: mode==="all"?"#7b9cff":"#666", fontSize:"0.82rem", cursor:"pointer", fontFamily:"inherit", fontWeight: mode==="all"?700:400 }}>
          📋 逐分回放
        </button>
        <button onClick={() => setMode("key")}
          style={{ flex:1, padding:"0.5rem", borderRadius:"8px", border:`1.5px solid ${mode==="key"?"#f5a623":"rgba(255,255,255,0.1)"}`, background: mode==="key"?"rgba(245,166,35,0.12)":"transparent", color: mode==="key"?"#f5a623":"#666", fontSize:"0.82rem", cursor:"pointer", fontFamily:"inherit", fontWeight: mode==="key"?700:400 }}>
          🎯 關鍵分
        </button>
      </div>

      {/* 關鍵分模式：篩選按鈕 */}
      {mode === "key" && (
        <div style={{ display:"flex", gap:"0.4rem", flexWrap:"wrap", marginBottom:"0.8rem" }}>
          <button onClick={() => setKeyFilter(null)}
            style={{ padding:"0.3rem 0.7rem", borderRadius:"20px", border:`1.5px solid ${keyFilter===null?"#e8eaf6":"rgba(255,255,255,0.15)"}`, background: keyFilter===null?"rgba(255,255,255,0.1)":"transparent", color: keyFilter===null?"#e8eaf6":"#555", fontSize:"0.75rem", cursor:"pointer", fontFamily:"inherit" }}>
            全部關鍵分 ({points.filter(pt=>pt.keyMoments?.length>0).length})
          </button>
          {KEY_TYPES.map(k => keyCounts[k.id] > 0 && (
            <button key={k.id} onClick={() => setKeyFilter(keyFilter===k.id ? null : k.id)}
              style={{ padding:"0.3rem 0.7rem", borderRadius:"20px", border:`1.5px solid ${keyFilter===k.id ? k.color : k.color+"55"}`, background: keyFilter===k.id ? `${k.color}22` : "transparent", color: keyFilter===k.id ? k.color : k.color+"99", fontSize:"0.75rem", cursor:"pointer", fontFamily:"inherit" }}>
              {k.label} ({keyCounts[k.id]})
            </button>
          ))}
        </div>
      )}

      {/* 分列表 */}
      {(mode==="all" ? allPoints : keyPoints).length === 0 && (
        <p style={{ color:"#444d6e", textAlign:"center", fontSize:"0.85rem", marginTop:"1rem" }}>
          {mode==="key" ? "尚無關鍵分記錄" : "尚無紀錄"}
        </p>
      )}
      {[...(mode==="all" ? allPoints : keyPoints)].reverse().map((pt, ri) => {
        const idx = points.length - ri;
        const isOpen = selected === pt.id;
        const snap = pt.scoreSnapshot;
        const gameStr = gameScoreStr(snap?.currentGame, false);
        const setStr = setScoreStr(snap?.sets, snap?.currentSet);
        return (
          <div key={pt.id} style={{ marginBottom:"0.5rem", background:"rgba(255,255,255,0.03)", borderRadius:"10px", border:"1px solid rgba(255,255,255,0.07)", overflow:"hidden" }}>
            {/* 標題列 */}
            <div onClick={() => setSelected(isOpen ? null : pt.id)}
              style={{ display:"flex", alignItems:"center", gap:"0.5rem", padding:"0.6rem 0.8rem", cursor:"pointer" }}>
              {/* 比分區塊 */}
              <div style={{ display:"flex", flexDirection:"column", alignItems:"center", minWidth:"52px", background:"rgba(123,156,255,0.08)", borderRadius:"6px", padding:"0.2rem 0.4rem" }}>
                <span style={{ color:"#7b9cff", fontSize:"0.78rem", fontWeight:900, lineHeight:1.2 }}>{gameStr}</span>
                <span style={{ color:"#444d6e", fontSize:"0.65rem", lineHeight:1.1 }}>{setStr}</span>
              </div>
              <div style={{ flex:1 }}>
                <div style={{ color:"#00e5a0", fontWeight:700, fontSize:"0.85rem" }}>{pn(pt.pointWinner)} 得分</div>
                {pt.videoTimestamp && (
                  <div style={{ color:"#f5a623", fontSize:"0.72rem", marginTop:"0.1rem" }}>
                    🎬 {pt.videoTimestamp}
                  </div>
                )}
                {pt.keyMoments?.length > 0 && (
                  <div style={{ display:"flex", gap:"0.25rem", marginTop:"0.25rem", flexWrap:"wrap" }}>
                    {pt.keyMoments.map(km => {
                      const kt = KEY_TYPES.find(k=>k.id===km);
                      return kt ? (
                        <span key={km} style={{ fontSize:"0.65rem", padding:"0.1rem 0.4rem", borderRadius:"10px", background:`${kt.color}22`, border:`1px solid ${kt.color}66`, color:kt.color, fontWeight:700 }}>{kt.label}</span>
                      ) : null;
                    })}
                  </div>
                )}
              </div>
              <span style={{ color:"#aaa", fontSize:"0.78rem" }}>{reasonMap[pt.pointEndReason]}</span>
              {pt.rallyCount > 0 && <span style={{ color:"#f5a623", fontSize:"0.72rem", background:"rgba(245,166,35,0.1)", borderRadius:"4px", padding:"0.1rem 0.4rem" }}>來回{pt.rallyCount}拍</span>}
              <span style={{ color:"#444d6e", fontSize:"0.8rem" }}>{isOpen ? "▲" : "▼"}</span>
            </div>

            {/* 展開詳情 */}
            {isOpen && (
              <div style={{ padding:"0 0.8rem 0.8rem", borderTop:"1px solid rgba(255,255,255,0.06)" }}>
                {/* 時間戳記 */}
                {pt.videoTimestamp && (
                  <div style={{ marginTop:"0.6rem", display:"flex", alignItems:"center", gap:"0.5rem", background:"rgba(245,166,35,0.08)", borderRadius:"6px", padding:"0.4rem 0.6rem" }}>
                    <span style={{ fontSize:"0.75rem", color:"#f5a623" }}>🎬 Swing Vision 影片時間</span>
                    <span style={{ color:"#e8eaf6", fontWeight:700, fontSize:"0.85rem", letterSpacing:"0.05em" }}>{pt.videoTimestamp}</span>
                  </div>
                )}
                {/* 發球 */}
                <div style={{ marginTop:"0.6rem" }}>
                  <div style={{ color:"#7b9cff", fontSize:"0.75rem", marginBottom:"0.3rem" }}>🎾 發球</div>
                  <div style={{ display:"flex", flexWrap:"wrap", gap:"0.3rem" }}>
                    <Tag label={`發球方：${pn(pt.server)}`} color="#7b9cff"/>
                    <Tag label={pt.serve1 === "in" ? "第一發進" : "第一發失誤"} color={pt.serve1==="in" ? "#00e5a0" : "#ff6b6b"}/>
                    {pt.serve1 === "fault" && pt.serve2 && <Tag label={pt.serve2==="in" ? "第二發進" : "Double Fault"} color={pt.serve2==="in" ? "#00e5a0" : "#ff6b6b"}/>}
                    {pt.serveType && <Tag label={pt.serveType} color="#f5a623"/>}
                    {pt.serveLanding && <Tag label={`落點：${serveMap[pt.serveLanding] ?? pt.serveLanding}`} color="#f5a623"/>}
                  </div>
                </div>

                {/* 對打過程 */}
                {pt.rallyEvents.length > 0 && (
                  <div style={{ marginTop:"0.6rem" }}>
                    <div style={{ color:"#7b9cff", fontSize:"0.75rem", marginBottom:"0.3rem" }}>🏓 對打過程</div>
                    {pt.rallyEvents.map((ev, i) => {
                      const outcomeColor = { winner:"#00e5a0", forced_error:"#f5a623", unforced_error:"#ff6b6b", continue:"#7b9cff" }[ev.outcome] ?? "#aaa";
                      return (
                        <div key={i} style={{ display:"flex", alignItems:"flex-start", gap:"0.4rem", marginBottom:"0.4rem", paddingLeft:"0.4rem", borderLeft:`2px solid ${outcomeColor}` }}>
                          <div>
                            <span style={{ color:"#e8eaf6", fontSize:"0.8rem", fontWeight:700 }}>{pn(ev.shotBy)}</span>
                            <span style={{ color:"#aaa", fontSize:"0.78rem" }}> · {ev.shotType}</span>
                            {ev.landing && <span style={{ color:"#7b9cff", fontSize:"0.75rem" }}> → {landingMap[ev.landing] ?? ev.landing}</span>}
                            <div style={{ display:"flex", gap:"0.3rem", marginTop:"0.2rem", flexWrap:"wrap" }}>
                              <Tag label={ev.outcome === "continue" ? "繼續對打" : (reasonMap[ev.outcome] ?? ev.outcome)} color={outcomeColor} small/>
                              {ev.hand && <Tag label={handMap[ev.hand] ?? ev.hand} color="#f5a623" small/>}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* 球路動畫圖 */}
                {pt.rallyEvents.some(ev => ev.landing) && (
                  <div style={{ marginTop:"0.8rem" }}>
                    <div style={{ color:"#7b9cff", fontSize:"0.75rem", marginBottom:"0.4rem" }}>🎾 球路圖</div>
                    <RallyCourtAnimation
                      events={pt.rallyEvents}
                      server={pt.server}
                      serveLanding={pt.serveLanding}
                      p1Name={p1Name}
                      p2Name={p2Name}
                    />
                  </div>
                )}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function Tag({ label, color, small }) {
  return (
    <span style={{ background:`${color}22`, border:`1px solid ${color}55`, borderRadius:"4px", padding: small ? "0.05rem 0.35rem" : "0.15rem 0.5rem", color, fontSize: small ? "0.7rem" : "0.75rem", whiteSpace:"nowrap" }}>

// 九宮格區域中心點座標（相對於全場，縱向，擊球方在下）
// 球場：W=280, H=380，兩半場各自對稱
// 從底線到底線：p1在下半場，p2在上半場
// 網在中間 H/2

function getLandingCenter(landingId, W, H) {
  // 球場區域定義（全場縱向，0,0在左上，H為底線到底線）
  // 上半場（對手，p2方）：netY=H*0.07 ~ H*0.5
  // 下半場（p1方）：H*0.5 ~ baseLineY=H*0.93
  const netY = H * 0.07;
  const midY = H * 0.5;
  const baseY = H * 0.93;
  const lx = W * 0.08, rx = W * 0.92;
  const cW = rx - lx;
  const colW = cW / 3;

  // 上半場（對手場地，y從netY到midY）
  // net區：netY ~ netY+serveH, mid區, base區(靠近中線midY)
  const upServeH = (midY - netY) * 0.35;
  const upMidH   = (midY - netY) * 0.32;
  const upBaseH  = (midY - netY) * 0.33;

  // 下半場（己方場地，y從midY到baseY）
  const dnNetH  = (baseY - midY) * 0.35;
  const dnMidH  = (baseY - midY) * 0.32;
  const dnBaseH = (baseY - midY) * 0.33;

  const centers = {
    // 對手場地（上半場，球打過去的落點）
    "net-L":  { x: lx + colW*0 + colW/2, y: netY + upServeH/2 },
    "net-M":  { x: lx + colW*1 + colW/2, y: netY + upServeH/2 },
    "net-R":  { x: lx + colW*2 + colW/2, y: netY + upServeH/2 },
    "mid-L":  { x: lx + colW*0 + colW/2, y: netY + upServeH + upMidH/2 },
    "mid-M":  { x: lx + colW*1 + colW/2, y: netY + upServeH + upMidH/2 },
    "mid-R":  { x: lx + colW*2 + colW/2, y: netY + upServeH + upMidH/2 },
    "base-L": { x: lx + colW*0 + colW/2, y: netY + upServeH + upMidH + upBaseH/2 },
    "base-M": { x: lx + colW*1 + colW/2, y: netY + upServeH + upMidH + upBaseH/2 },
    "base-R": { x: lx + colW*2 + colW/2, y: netY + upServeH + upMidH + upBaseH/2 },
  };
  return centers[landingId] ?? { x: W/2, y: midY };
}

function getZoneCenterInCourt(zoneId, W, H, hitter) {
  const lx = W * 0.1, rx = W * 0.9, cW = rx - lx, colW = cW / 3;
  const netY = H * 0.08, midY = H * 0.5, baseY = H * 0.92;
  const halfH = midY - netY;
  const rowFrac = [0.28, 0.38, 0.34];
  const zones = [
    { id:"net-L",  col:0, row:0 }, { id:"net-M",  col:1, row:0 }, { id:"net-R",  col:2, row:0 },
    { id:"mid-L",  col:0, row:1 }, { id:"mid-M",  col:1, row:1 }, { id:"mid-R",  col:2, row:1 },
    { id:"base-L", col:0, row:2 }, { id:"base-M", col:1, row:2 }, { id:"base-R", col:2, row:2 },
  ];
  const z = zones.find(z => z.id === zoneId);
  if (!z) return { x: W/2, y: midY };
  const cx = lx + z.col * colW + colW / 2;
  const rowTop = rowFrac.slice(0, z.row).reduce((a,b)=>a+b, 0);
  const rowMid = rowTop + rowFrac[z.row] / 2;
  if (hitter === "p1") {
    // p1打，球落在p2場地（上半場）：網前靠近midY，底線靠近netY
    return { x: cx, y: midY - rowMid * halfH };
  } else {
    // p2打，球落在p1場地（下半場）：網前靠近midY，底線靠近baseY
    return { x: cx, y: midY + rowMid * (baseY - midY) };
  }
}

function getArcFactor(shotType) {
  if (!shotType) return 0.35;
  if (shotType.includes("吊高") || shotType.includes("挑高")) return 0.65;
  if (shotType.includes("切球") || shotType.includes("截擊")) return 0.15;
  if (shotType.includes("高壓")) return 0.18;
  if (shotType.includes("放短")) return 0.2;
  return 0.32;
}

function makeArcPath(from, to, W, H) {
  // 鼻形弧線：控制點在網（中線midY）上方形成弧頂
  const midY = H * 0.5;
  const cx = (from.x + to.x) / 2;
  const dx = Math.abs(to.x - from.x), dy = Math.abs(to.y - from.y);
  const arcH = dx * 0.3 + dy * 0.2;
  // 弧頂在網附近（midY）
  const ctrlY = midY - arcH * 0.5;
  return `M ${from.x.toFixed(1)} ${from.y.toFixed(1)} Q ${cx.toFixed(1)} ${ctrlY.toFixed(1)} ${to.x.toFixed(1)} ${to.y.toFixed(1)}`;
}

function CourtSVG({ W, H, children, p1Name, p2Name }) {
  const lx = W*0.1, rx = W*0.9, cW = rx-lx, colW = cW/3;
  const netY = H*0.08, midY = H*0.5, baseY = H*0.92;
  const upH = midY - netY;
  const rowFrac = [0.28, 0.38, 0.34];
  const p1Color = "#00e5a0", p2Color = "#f5a623";
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width:"100%", borderRadius:"12px", background:"#1a6b3a", display:"block" }}>
      {/* 場地底色 */}
      <rect x={lx} y={netY}  width={cW} height={midY-netY} fill="#2474a8"/>
      <rect x={lx} y={midY} width={cW} height={baseY-midY} fill="#2980b9"/>
      {/* 場地線 */}
      <line x1={lx} y1={netY}  x2={rx} y2={netY}  stroke="white" strokeWidth="1.5"/>
      <line x1={lx} y1={baseY} x2={rx} y2={baseY} stroke="white" strokeWidth="1.5"/>
      <line x1={lx} y1={netY}  x2={lx} y2={baseY} stroke="white" strokeWidth="2"/>
      <line x1={rx} y1={netY}  x2={rx} y2={baseY} stroke="white" strokeWidth="2"/>
      {/* 網（正中間） */}
      <line x1={lx} y1={midY} x2={rx} y2={midY} stroke="white" strokeWidth="3"/>
      {/* 發球線（上半場=p2場地，靠近midY的37%處） */}
      <line x1={lx} y1={netY + upH*0.72} x2={rx} y2={netY + upH*0.72} stroke="white" strokeWidth="1.2"/>
      {/* 發球線（下半場=p1場地） */}
      <line x1={lx} y1={midY + (baseY-midY)*0.28} x2={rx} y2={midY + (baseY-midY)*0.28} stroke="white" strokeWidth="1.2"/>
      {/* 中線 */}
      <line x1={W/2} y1={netY + upH*0.72} x2={W/2} y2={netY} stroke="white" strokeWidth="1.2"/>
      <line x1={W/2} y1={midY} x2={W/2} y2={midY + (baseY-midY)*0.28} stroke="white" strokeWidth="1.2"/>
      {/* 九宮格虛線（p2上半場，從midY往上）*/}
      {[1,2].map(i => <line key={`vu${i}`} x1={lx+colW*i} y1={netY} x2={lx+colW*i} y2={midY} stroke="rgba(255,255,255,0.25)" strokeWidth="1" strokeDasharray="4,3"/>)}
      {rowFrac.slice(0,2).map((_, i) => {
        const rowMid = rowFrac.slice(0,i+1).reduce((a,b)=>a+b,0);
        const y = midY - rowMid * upH;
        return <line key={`hu${i}`} x1={lx} y1={y} x2={rx} y2={y} stroke="rgba(255,255,255,0.25)" strokeWidth="1" strokeDasharray="4,3"/>;
      })}
      {/* 九宮格虛線（p1下半場）*/}
      {[1,2].map(i => <line key={`vd${i}`} x1={lx+colW*i} y1={midY} x2={lx+colW*i} y2={baseY} stroke="rgba(255,255,255,0.15)" strokeWidth="1" strokeDasharray="4,3"/>)}
      {rowFrac.slice(0,2).map((_, i) => {
        const y = midY + rowFrac.slice(0,i+1).reduce((a,b)=>a+b,0)*(baseY-midY);
        return <line key={`hd${i}`} x1={lx} y1={y} x2={rx} y2={y} stroke="rgba(255,255,255,0.15)" strokeWidth="1" strokeDasharray="4,3"/>;
      })}
      {/* 標示 */}
      <text x={W/2} y={midY-6} textAnchor="middle" fill="white" fontSize="9" fontWeight="bold">網</text>
      <text x={rx+4} y={netY+upH*0.5} textAnchor="start" dominantBaseline="middle" fill={p2Color} fontSize="8">{p2Name}</text>
      <text x={rx+4} y={midY+(baseY-midY)*0.5} textAnchor="start" dominantBaseline="middle" fill={p1Color} fontSize="8">{p1Name}</text>
      {["網前","中場","底線"].map((label,i) => {
        // 上半場標籤：網前靠近midY，底線靠近netY
        const rowMid = rowFrac.slice(0,i).reduce((a,b)=>a+b,0) + rowFrac[i]/2;
        const y = midY - rowMid * upH;
        return <text key={i} x={lx-3} y={y} textAnchor="end" dominantBaseline="middle" fill="rgba(255,255,255,0.5)" fontSize="6.5">{label}</text>;
      })}
      {children}
    </svg>
  );
}

function RallyLandingPicker({ onSelect, hitter, shotType, prevLanding, prevHitter, gameScore, p1Name, p2Name }) {
  const [selected, setSelected] = useState(null);
  const [hovered, setHovered] = useState(null);
  const W = 280, H = 300;
  const lx = W*0.1, rx = W*0.9, cW = rx-lx, colW = cW/3;
  const netY = H*0.08, midY = H*0.5, baseY = H*0.92;
  const upH = midY - netY;
  const rowFrac = [0.28, 0.38, 0.34];
  const p1Color = "#00e5a0", p2Color = "#f5a623";
  const hitterColor = hitter === "p1" ? p1Color : p2Color;

  const zones = [
    { id:"net-L",  col:0, row:0 }, { id:"net-M",  col:1, row:0 }, { id:"net-R",  col:2, row:0 },
    { id:"mid-L",  col:0, row:1 }, { id:"mid-M",  col:1, row:1 }, { id:"mid-R",  col:2, row:1 },
    { id:"base-L", col:0, row:2 }, { id:"base-M", col:1, row:2 }, { id:"base-R", col:2, row:2 },
  ];

  // 起點：上一球落在 hitter 的場地（hitter 站的位置）
  const getStartPt = () => {
    // 有上一拍的rally落點
    if (prevLanding && !["Wide","Body","T"].includes(prevLanding)) {
      return getZoneCenterInCourt(prevLanding, W, H, prevHitter);
    }
    // 第一拍接發球：根據發球落點和發球者位置決定接球站位
    if (prevLanding && ["Wide","Body","T"].includes(prevLanding)) {
      const isDeuceSide = ((gameScore?.p1 ?? 0) + (gameScore?.p2 ?? 0)) % 2 === 0;

      const serverIsBottom = prevHitter === "p1"; // 發球者在畫面下方
      const receiverY = serverIsBottom
        ? netY + 12    // 接球者在上半場
        : baseY - 12;  // 接球者在下半場

      // 發球者在上方（p2）：Deuce→接球者右下，Ad→左下（正常）
      // 發球者在下方（p1）：Deuce→接球者左上，Ad→右上（鏡像）
      const isRight = serverIsBottom ? !isDeuceSide : isDeuceSide;

      if (prevLanding === "Wide") return { x: isRight ? lx + cW*0.85 : lx + cW*0.15, y: receiverY };
      if (prevLanding === "Body") return { x: isRight ? lx + cW*0.67 : lx + cW*0.33, y: receiverY };
      if (prevLanding === "T")    return { x: isRight ? lx + cW*0.45 : lx + cW*0.55, y: receiverY };
    }
    return hitter === "p1"
      ? { x: W/2, y: baseY - 15 }
      : { x: W/2, y: netY + 15 };
  };

  // 終點：hitter 打到對手場地
  const getEndPt = (id) => getZoneCenterInCourt(id, W, H, hitter);

  const arcFactor = getArcFactor(shotType);
  const startPt = getStartPt();
  const activeId = selected ?? hovered;
  const activePt = activeId ? getEndPt(activeId) : null;

  const handleClick = (id) => {
    setSelected(id);
    setTimeout(() => onSelect(id), 250);
  };

  const getZoneRect = (z) => {
    const x = lx + z.col * colW;
    const rowTop = rowFrac.slice(0, z.row).reduce((a,b)=>a+b, 0);
    let y, h;
    if (hitter === "p1") {
      // p1打，落在p2上半場（netY~midY）
      // row=0網前靠近midY，row=2底線靠近netY
      // 從midY往上排列
      const sH = upH;
      y = midY - (rowTop + rowFrac[z.row]) * sH;
      h = sH * rowFrac[z.row];
    } else {
      // p2打，落在p1下半場（midY~baseY）
      // row=0網前靠近midY，row=2底線靠近baseY
      const sH = baseY - midY;
      y = midY + sH * rowTop;
      h = sH * rowFrac[z.row];
    }
    return { x, y, w: colW, h };
  };

  return (
    <div>
      <p style={{ color:"#aab8d0", fontSize:"0.78rem", textAlign:"center", margin:"0 0 0.5rem" }}>
        點擊選擇落點，即時預覽球路
      </p>
      <CourtSVG W={W} H={H} p1Name={p1Name} p2Name={p2Name}>
        {/* 可點擊落點區域 */}
        {zones.map(z => {
          const r = getZoneRect(z);
          const isActive = hovered===z.id || selected===z.id;
          return (
            <g key={z.id} style={{ cursor:"pointer" }}
              onClick={() => handleClick(z.id)}
              onMouseEnter={() => setHovered(z.id)}
              onMouseLeave={() => setHovered(null)}
              onTouchStart={(e) => { e.preventDefault(); setHovered(z.id); }}
              onTouchEnd={(e) => { e.preventDefault(); handleClick(z.id); setHovered(null); }}>
              <rect x={r.x} y={r.y} width={r.w} height={r.h}
                fill={isActive ? `${hitterColor}44` : "transparent"}
                stroke={isActive ? hitterColor : "transparent"} strokeWidth="1.5"/>
            </g>
          );
        })}
        {/* 球路預覽 */}
        {activePt && (
          <>
            <path d={makeArcPath(startPt, activePt, W, H)} fill="none"
              stroke={hitterColor} strokeWidth="2.5"
              strokeDasharray={hovered && !selected ? "7,4" : "none"} opacity="0.95"/>
            <circle cx={activePt.x} cy={activePt.y} r="7" fill={hitterColor} stroke="white" strokeWidth="2"/>
            <text x={activePt.x} y={activePt.y+1} textAnchor="middle" dominantBaseline="middle" fill="white" fontSize="9" fontWeight="bold">✓</text>
          </>
        )}
        {/* 起點 */}
        <circle cx={startPt.x} cy={startPt.y} r="7"
          fill={prevHitter==="p1" ? p1Color : p2Color} stroke="white" strokeWidth="2"/>
        <text x={startPt.x} y={startPt.y+1} textAnchor="middle" dominantBaseline="middle" fill="#0a0f1e" fontSize="8" fontWeight="bold">●</text>
      </CourtSVG>
      {selected && (
        <button onClick={() => onSelect(selected)}
          style={{ width:"100%", marginTop:"0.6rem", padding:"0.7rem", background:`${hitterColor}22`, border:`2px solid ${hitterColor}`, borderRadius:"10px", color:hitterColor, fontSize:"0.9rem", fontWeight:700, cursor:"pointer", fontFamily:"inherit" }}>
          確認落點 ✓
        </button>
      )}
    </div>
  );
}

function RallyCourtAnimation({ events, server, serveLanding, p1Name, p2Name }) {
  const [step, setStep] = useState(-1);
  const W = 280, H = 320;
  const p1Color = "#00e5a0", p2Color = "#f5a623";
  const playerColor = (p) => p === "p1" ? p1Color : p2Color;
  const outcomeColor = { winner:"#00e5a0", forced_error:"#f5a623", unforced_error:"#ff6b6b", continue:"rgba(255,255,255,0.5)" };

  const shots = [];
  let prevPt = null;
  let prevHitter = server;

  events.forEach((ev, i) => {
    if (!ev.landing) return;
    const endPt = getZoneCenterInCourt(ev.landing, W, H, ev.shotBy);
    // 起點：上一球落在己方場地（即 ev.shotBy 打球前的位置）
    const startPt = prevPt ?? (
      ev.shotBy === "p1"
        ? { x: W/2, y: H*0.92 - 12 }
        : { x: W/2, y: H*0.08 + 12 }
    );
    shots.push({ from: startPt, to: endPt, shotBy: ev.shotBy, shotType: ev.shotType, outcome: ev.outcome, label: `${i+1}` });
    prevPt = endPt;
    prevHitter = ev.shotBy;
  });

  const displayShots = step === -1 ? shots : shots.slice(0, step + 1);

  return (
    <div>
      <CourtSVG W={W} H={H} p1Name={p1Name} p2Name={p2Name}>
        {displayShots.map((sh, i) => {
          const col = playerColor(sh.shotBy);
          const isLast = i === displayShots.length - 1;
          const endCol = isLast ? (outcomeColor[sh.outcome] ?? col) : col;
          return (
            <g key={i}>
              <path d={makeArcPath(sh.from, sh.to, W, H)} fill="none"
                stroke={col} strokeWidth={isLast ? 2.5 : 2}
                strokeDasharray={sh.outcome==="unforced_error"||sh.outcome==="forced_error" ? "5,3" : "none"}
                opacity={isLast ? 1 : 0.7}/>
              <circle cx={sh.to.x} cy={sh.to.y} r="5" fill={endCol} stroke="white" strokeWidth="1.5"/>
              <text x={sh.to.x} y={sh.to.y+1} textAnchor="middle" dominantBaseline="middle" fill="white" fontSize="6.5" fontWeight="bold">{sh.label}</text>
            </g>
          );
        })}
        {shots.length > 0 && (
          <circle cx={shots[0].from.x} cy={shots[0].from.y} r="6" fill={playerColor(shots[0].shotBy)} stroke="white" strokeWidth="1.5"/>
        )}
      </CourtSVG>
      <div style={{ display:"flex", gap:"0.4rem", marginTop:"0.5rem", justifyContent:"center", flexWrap:"wrap" }}>
        <button onClick={() => setStep(-1)}
          style={{ padding:"0.3rem 0.7rem", background: step===-1 ? "#7b9cff" : "rgba(255,255,255,0.05)", border:"1px solid rgba(123,156,255,0.3)", borderRadius:"6px", color: step===-1 ? "#0a0f1e" : "#7b9cff", fontSize:"0.75rem", cursor:"pointer", fontFamily:"inherit", fontWeight:700 }}>
          全部
        </button>
        {shots.map((sh, i) => (
          <button key={i} onClick={() => setStep(i)}
            style={{ padding:"0.3rem 0.6rem", background: step===i ? playerColor(sh.shotBy)+"33" : "rgba(255,255,255,0.05)", border:`1px solid ${playerColor(sh.shotBy)}55`, borderRadius:"6px", color: playerColor(sh.shotBy), fontSize:"0.75rem", cursor:"pointer", fontFamily:"inherit" }}>
            第{i+1}拍
          </button>
        ))}
      </div>
      <div style={{ display:"flex", gap:"0.8rem", marginTop:"0.4rem", justifyContent:"center", flexWrap:"wrap" }}>
        <span style={{ fontSize:"0.68rem", color: p1Color }}>■ {p1Name}</span>
        <span style={{ fontSize:"0.68rem", color: p2Color }}>■ {p2Name}</span>
        <span style={{ fontSize:"0.68rem", color: "#aaa" }}>- - - 失誤</span>
      </div>
    </div>
  );
}
