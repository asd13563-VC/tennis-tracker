<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="網球記錄">
  <title>🎾 網球比賽記錄</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: #0a0f1e; font-family: 'Noto Sans TC', sans-serif; overscroll-behavior: none; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script type="text/babel" data-presets="react">
    const { useState, useCallback, useEffect } = React;


// ── Constants ──────────────────────────────────────────────────────────────
const SCORE_SEQ = ["0", "15", "30", "40"];

const MATCH_FORMATS = [
  { id: "s6_noad",    label: "一盤六局（Deuce搶一分）", sets: 1, gamesPerSet: 6, noAd: true,  thirdSetSuper: false },
  { id: "s6",         label: "一盤六局",                 sets: 1, gamesPerSet: 6, noAd: false, thirdSetSuper: false },
  { id: "s8",         label: "一盤八局",                 sets: 1, gamesPerSet: 8, noAd: false, thirdSetSuper: false },
  { id: "bo3_super",  label: "三盤兩勝（第三盤 Super Tiebreak）", sets: 3, gamesPerSet: 6, noAd: false, thirdSetSuper: true },
  { id: "bo3_full",   label: "三盤兩勝（完整三盤六局）", sets: 3, gamesPerSet: 6, noAd: false, thirdSetSuper: false },
];

const SERVE_TYPES = ["Flat serve", "Slice serve", "Kick serve"];
const SHOT_TYPES = [
  "底線抽球", "切球", "中場攻擊球", "吊高球",
  "半截擊", "網前截擊", "中場截擊",
  "高壓扣殺（未落地）", "高壓扣殺（已落地）", "底線扣殺",
  "底線放短球", "網前放短球",
];
const OUTCOME_TYPES = [
  { id: "winner", label: "Winner ✦", color: "#00e5a0" },
  { id: "forced_error", label: "受迫失誤", color: "#f5a623" },
  { id: "unforced_error", label: "非受迫失誤", color: "#ff6b6b" },
  { id: "continue", label: "繼續對打", color: "#7b9cff" },
];

const initScore = () => ({ sets: [], currentSet: { p1: 0, p2: 0 }, currentGame: { p1: 0, p2: 0 }, tiebreak: false });

// ── Helpers ────────────────────────────────────────────────────────────────
function gameScoreLabel(g, tiebreak, noAd) {
  if (tiebreak) return `${g.p1} - ${g.p2}`;
  const s1 = SCORE_SEQ[g.p1] ?? "AD";
  const s2 = SCORE_SEQ[g.p2] ?? "AD";
  if (g.p1 >= 3 && g.p2 >= 3) {
    if (noAd) return "Deuce（搶分）";
    if (g.p1 === g.p2) return "Deuce";
    return g.p1 > g.p2 ? "Ad P1" : "Ad P2";
  }
  return `${s1} - ${s2}`;
}

function advanceGame(game, winner, noAd) {
  const g = { ...game };
  g[winner] += 1;
  const other = winner === "p1" ? "p2" : "p1";

  if (noAd) {
    // noAd：雙方都到40（index=3）才是Deuce，Deuce後再得一分直接得局
    // 若加分後 winner >= 4 且 other < 3，正常得局
    // 若加分後雙方都 >= 3（含剛到Deuce），繼續
    // 若已在Deuce（雙方都=3）winner 再得一分（變4），直接得局
    if (g[winner] >= 4 && g[other] < 3) return { won: winner, game: { p1: 0, p2: 0 } };
    if (g[winner] >= 4 && g[other] >= 3) return { won: winner, game: { p1: 0, p2: 0 } }; // Deuce後搶分
    if (g[winner] >= 3 && g[other] >= 3) return { won: null, game: g }; // 剛到Deuce，繼續
    if (g[winner] >= 4) return { won: winner, game: { p1: 0, p2: 0 } };
    return { won: null, game: g };
  }

  // 一般Deuce邏輯（需連贏兩分）
  if (g.p1 >= 3 && g.p2 >= 3) {
    if (g[winner] - g[other] >= 2) return { won: winner, game: { p1: 0, p2: 0 } };
    return { won: null, game: g };
  }
  if (g[winner] >= 4) return { won: winner, game: { p1: 0, p2: 0 } };
  return { won: null, game: g };
}

function advanceTiebreak(game, winner) {
  const g = { ...game };
  g[winner] += 1;
  const other = winner === "p1" ? "p2" : "p1";
  if (g[winner] >= 7 && g[winner] - g[other] >= 2) return { won: winner, game: { p1: 0, p2: 0 } };
  return { won: null, game: g };
}

function advanceSuperTiebreak(game, winner) {
  const g = { ...game };
  g[winner] += 1;
  const other = winner === "p1" ? "p2" : "p1";
  if (g[winner] >= 10 && g[winner] - g[other] >= 2) return { won: winner, game: { p1: 0, p2: 0 } };
  return { won: null, game: g };
}

function advanceSet(set, winner, tiebreak, gamesPerSet) {
  const s = { ...set };
  s[winner] += 1;
  const other = winner === "p1" ? "p2" : "p1";
  if (tiebreak) return { won: winner, newSet: { p1: 0, p2: 0 }, tiebreak: false, superTiebreak: false };
  if (s[winner] >= gamesPerSet && s[winner] - s[other] >= 2) return { won: winner, newSet: { p1: 0, p2: 0 }, tiebreak: false, superTiebreak: false };
  if (s[winner] === gamesPerSet + 1) return { won: winner, newSet: { p1: 0, p2: 0 }, tiebreak: false, superTiebreak: false };
  const newTiebreak = s.p1 === gamesPerSet && s.p2 === gamesPerSet;
  return { won: null, newSet: s, tiebreak: newTiebreak, superTiebreak: false };
}

// ── Point tree node builder ─────────────────────────────────────────────────
function createPoint(server, scoreSnapshot) {
  return {
    id: Date.now() + Math.random(),
    server,
    scoreSnapshot: scoreSnapshot ?? null,
    serve1: null,
    serve2: null,
    rallyEvents: [],
    rallyCount: 0,
    pointWinner: null,
    pointEndReason: null,
    videoTimestamp: null, // Swing Vision 影片時間戳記 (e.g. "02:35")
    timestamp: new Date().toISOString(),
  };
}

// ── Main Component ─────────────────────────────────────────────────────────
function TennisTracker() {
  const [p1Name, setP1Name] = useState("球員 A");
  const [p2Name, setP2Name] = useState("球員 B");
  const [matchStarted, setMatchStarted] = useState(false);
  const [format, setFormat] = useState(MATCH_FORMATS[0]);
  const [initialServer, setInitialServer] = useState("p1");
  const [server, setServer] = useState("p1");
  const [score, setScore] = useState(initScore());
  const [superTiebreak, setSuperTiebreak] = useState(false); // 第三盤 Super Tiebreak 模式
  const [points, setPoints] = useState([]);
  const [currentPoint, setCurrentPoint] = useState(null);
  const [phase, setPhase] = useState("serve1"); // serve1 | serve2 | rally
  const [showStats, setShowStats] = useState(false);
  const [matchOver, setMatchOver] = useState(false);
  const [matchWinner, setMatchWinner] = useState(null);
  const [showChangeSides, setShowChangeSides] = useState(false); // 換邊提示
  const [p1Side, setP1Side] = useState("south");
  const [showHistory, setShowHistory] = useState(false);      // 歷史記錄頁
  const [historyMatch, setHistoryMatch] = useState(null);     // 正在檢視的歷史比賽
  const [hmTab, setHmTab] = useState("replay");
  const [saveOnOver, setSaveOnOver] = useState(false);
  const [savedMatches, setSavedMatches] = useState(() => {
    try { return JSON.parse(localStorage.getItem("tennis_matches") || "[]"); }
    catch { return []; }
  }); // "south"|"north"，初始p1在南側
  const [selectedRallyShot, setSelectedRallyShot] = useState(null);
  const [nextHitter, setNextHitter] = useState(null);
  const [pendingErrorOutcome, setPendingErrorOutcome] = useState(null);
  const [pendingServeType, setPendingServeType] = useState(null);
  const [pendingServeLanding, setPendingServeLanding] = useState(null);
  const [pendingRallyLanding, setPendingRallyLanding] = useState(null);
  const [pendingShotLanding, setPendingShotLanding] = useState(null);
  const [activeTab, setActiveTab] = useState("record"); // "record" | "stats" | "replay"

  const playerName = (p) => (p === "p1" ? p1Name : p2Name);

  // ── 自動儲存到localStorage ────────────────────────────────────────────────
  useEffect(() => {
    if (!saveOnOver || !matchOver) return;
    try {
      const record = {
        id: Date.now(),
        date: new Date().toLocaleDateString("zh-TW"),
        time: new Date().toLocaleTimeString("zh-TW", { hour:"2-digit", minute:"2-digit" }),
        p1Name, p2Name,
        format: format.label,
        winner: matchWinner,
        sets: score.sets,
        points,
      };
      const existing = JSON.parse(localStorage.getItem("tennis_matches") || "[]");
      const updated = [record, ...existing].slice(0, 50);
      localStorage.setItem("tennis_matches", JSON.stringify(updated));
      setSavedMatches(updated);
    } catch(e) {}
    setSaveOnOver(false);
  }, [saveOnOver, matchOver]);
  const startMatch = () => {
    setInitialServer(server);
    setMatchStarted(true);
    const initSnap = { sets: [], currentSet: { p1: 0, p2: 0 }, currentGame: { p1: 0, p2: 0 } };
    setCurrentPoint(createPoint(server, initSnap));
    setPhase("serve1");
  };

  // ── Serve handlers ───────────────────────────────────────────────────────
  const handleServe1In = () => {
    setCurrentPoint((p) => ({ ...p, serve1: "in" }));
    setPendingServeType("serve1in");
  };

  const handleServe1Ace = () => {
    setCurrentPoint((p) => ({ ...p, serve1: "in" }));
    setPendingServeType("serve1ace");
  };

  const handleServe1Fault = () => {
    setCurrentPoint((p) => ({ ...p, serve1: "fault" }));
    setPhase("serve2");
  };

  const handleServe2In = () => {
    setCurrentPoint((p) => ({ ...p, serve2: "in" }));
    setPendingServeType("serve2in");
  };

  const handleServe2Ace = () => {
    setCurrentPoint((p) => ({ ...p, serve2: "in" }));
    setPendingServeType("serve2ace");
  };

  const handleDoubleFault = () => {
    const loser = currentPoint.server;
    const winner = loser === "p1" ? "p2" : "p1";
    finishPoint({ ...currentPoint, serve2: "fault", pointWinner: winner, pointEndReason: "double_fault" });
  };

  const handleServeTypeChoice = (serveType) => {
    const isAce = pendingServeType === "serve1ace" || pendingServeType === "serve2ace";
    setCurrentPoint((p) => ({ ...p, serveType }));
    setPendingServeType(null);
    setPendingServeLanding({ serveType, isAce });
  };

  const handleServeLanding = (landing) => {
    const { isAce } = pendingServeLanding;
    const gamePts = (score.currentGame.p1 ?? 0) + (score.currentGame.p2 ?? 0);
    const serveSide = gamePts % 2 === 0 ? "deuce" : "ad";
    setCurrentPoint((p) => ({ ...p, serveLanding: landing, serveSide }));
    setPendingServeLanding(null);
    if (isAce) {
      finishPoint({ ...currentPoint, serveType: pendingServeLanding.serveType, serveLanding: landing, pointWinner: currentPoint.server, pointEndReason: "ace" });
    } else {
      setPhase("rally");
      setSelectedRallyShot(null);
      setNextHitter(server === "p1" ? "p2" : "p1");
    }
  };

  // ── Rally handlers ───────────────────────────────────────────────────────
  const startRallyShot = (shotBy, shotType) => {
    // 選完球種 → 先選落點
    setPendingShotLanding({ shotBy, shotType });
    setSelectedRallyShot(null);
  };

  const handleShotLanding = (landing) => {
    if (!pendingShotLanding) return;
    const { shotBy, shotType } = pendingShotLanding;
    setSelectedRallyShot({ shotBy, shotType, landing });
    setPendingShotLanding(null);
  };

  const handleRallyOutcome = (outcome) => {
    if (!selectedRallyShot) return;
    const { shotBy, shotType, landing } = selectedRallyShot;

    if (outcome.id === "continue") {
      const event = { shotBy, shotType, outcome: outcome.id, hand: null, landing: landing ?? null };
      setCurrentPoint((p) => ({
        ...p,
        rallyEvents: [...p.rallyEvents, event],
        rallyCount: p.rallyCount + 1,
      }));
      setSelectedRallyShot(null);
      setNextHitter(shotBy === "p1" ? "p2" : "p1");
    } else if (outcome.id === "winner") {
      const event = { shotBy, shotType, outcome: outcome.id, hand: null, landing: landing ?? null };
      const updated = {
        ...currentPoint,
        rallyEvents: [...currentPoint.rallyEvents, event],
        rallyCount: currentPoint.rallyCount + 1,
        pointWinner: shotBy,
        pointEndReason: outcome.id,
      };
      setSelectedRallyShot(null);
      finishPoint(updated);
    } else {
      // forced_error or unforced_error → 先選正反拍
      setPendingErrorOutcome({ outcome, shotBy, shotType, landing: landing ?? null });
      setSelectedRallyShot(null);
    }
  };

  const handleHandChoice = (hand) => {
    if (!pendingErrorOutcome) return;
    const { outcome, shotBy, shotType, landing } = pendingErrorOutcome;
    const pointWinner = shotBy === "p1" ? "p2" : "p1";
    const event = { shotBy, shotType, outcome: outcome.id, hand, landing: landing ?? null };
    const updated = {
      ...currentPoint,
      rallyEvents: [...currentPoint.rallyEvents, event],
      rallyCount: currentPoint.rallyCount + 1,
      pointWinner,
      pointEndReason: outcome.id,
    };
    setPendingErrorOutcome(null);
    finishPoint(updated);
  };

  // ── Undo last point ──────────────────────────────────────────────────────
  const undoLastPoint = () => {
    if (points.length === 0) return;
    const newPoints = points.slice(0, -1);

    // Replay all remaining points to reconstruct score & server
    let replayScore = initScore();
    let replayServer = initialServer;

    const applyPoint = (pt) => {
      const winner = pt.pointWinner;
      const result = replayScore.tiebreak
        ? advanceTiebreak({ ...replayScore.currentGame }, winner)
        : advanceGame({ ...replayScore.currentGame }, winner);

      if (result.won) {
        const setResult = advanceSet({ ...replayScore.currentSet }, result.won, replayScore.tiebreak);
        replayScore.currentGame = result.game;
        if (setResult.won) {
          replayScore.sets = [...replayScore.sets, {
            p1: replayScore.currentSet.p1 + (result.won === "p1" ? 1 : 0),
            p2: replayScore.currentSet.p2 + (result.won === "p2" ? 1 : 0),
          }];
          replayScore.currentSet = setResult.newSet;
          replayScore.tiebreak = setResult.tiebreak;
        } else {
          replayScore.currentSet = setResult.newSet;
          replayScore.tiebreak = setResult.tiebreak;
        }
        replayServer = replayServer === "p1" ? "p2" : "p1";
      } else {
        replayScore.currentGame = result.game;
      }
    };

    newPoints.forEach(applyPoint);

    setPoints(newPoints);
    setScore(replayScore);
    setServer(replayServer);
    setSuperTiebreak(false);
    const undoSnap = { sets: replayScore.sets, currentSet: replayScore.currentSet, currentGame: replayScore.currentGame };
    setCurrentPoint(createPoint(replayServer, undoSnap));
    setPhase("serve1");
    setSelectedRallyShot(null);
    setNextHitter(null);
    setPendingErrorOutcome(null);
    setPendingServeType(null);
    setPendingServeLanding(null);
    setPendingRallyLanding(null);
    setPendingShotLanding(null);
    setMatchOver(false);
    setMatchWinner(null);
  };

  // ── Export helpers ───────────────────────────────────────────────────────
  const exportJSON = () => {
    const data = {
      matchInfo: {
        format: format.label,
        player1: p1Name,
        player2: p2Name,
        winner: playerName(matchWinner),
        date: new Date().toLocaleDateString("zh-TW"),
        sets: score.sets,
      },
      stats: { [p1Name]: stats.p1, [p2Name]: stats.p2 },
      points: points.map((pt, i) => ({
        index: i + 1,
        server: playerName(pt.server),
        serve1: pt.serve1,
        serve2: pt.serve2 ?? "-",
        serveType: pt.serveType ?? "-",
        rallyCount: pt.rallyCount,
        pointWinner: playerName(pt.pointWinner),
        pointEndReason: pt.pointEndReason,
        rallyEvents: pt.rallyEvents.map(ev => ({
          player: playerName(ev.shotBy),
          shotType: ev.shotType,
          outcome: ev.outcome,
          hand: ev.hand ?? "-",
        })),
      })),
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `tennis_${p1Name}_vs_${p2Name}_${new Date().toLocaleDateString("zh-TW").replace(/\//g, "-")}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const exportCSV = () => {
    const reasonMap = { ace: "ACE", double_fault: "雙重失誤", winner: "Winner", forced_error: "受迫失誤", unforced_error: "非受迫失誤" };
    const handMap = { forehand: "正拍", backhand: "反拍" };
    const rows = [["分數#", "影片時間", "發球員", "第一發球", "第二發球", "發球球種", "來回拍數", "得分球員", "結束原因", "最後球種", "正/反拍"]];
    points.forEach((pt, i) => {
      const lastEv = pt.rallyEvents[pt.rallyEvents.length - 1];
      rows.push([
        i + 1, pt.videoTimestamp ?? "-", playerName(pt.server),
        pt.serve1 === "in" ? "進" : "失誤",
        pt.serve2 ? (pt.serve2 === "in" ? "進" : "失誤") : "-",
        pt.serveType ?? "-", pt.rallyCount,
        playerName(pt.pointWinner),
        reasonMap[pt.pointEndReason] ?? pt.pointEndReason,
        lastEv ? lastEv.shotType : "-",
        lastEv ? (handMap[lastEv.hand] ?? "-") : "-",
      ]);
    });
    rows.push([]);
    rows.push(["統計項目", p1Name, p2Name]);
    [["總得分","points"],["ACE","aces"],["雙重失誤","doubleFaults"],["Winners","winners"],
     ["受迫失誤","forcedErrors"],["非受迫失誤","unforcedErrors"],["正拍失誤","fhErrors"],["反拍失誤","bhErrors"]
    ].forEach(([label, key]) => rows.push([label, stats.p1[key], stats.p2[key]]));

    const csv = rows.map(r => r.join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `tennis_${p1Name}_vs_${p2Name}_${new Date().toLocaleDateString("zh-TW").replace(/\//g, "-")}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  // ── 關鍵分判斷 ───────────────────────────────────────────────────────────
  const getKeyMoment = (gameScore, setScore, allSets, server, format, isTiebreak, isSuperTB) => {
    const labels = [];
    const g = gameScore;
    const cs = setScore;
    const { gamesPerSet, sets: maxSets, thirdSetSuper, noAd } = format;

    // Tiebreak / Super Tiebreak
    if (isSuperTB) {
      const diff = Math.abs(g.p1 - g.p2);
      const maxPts = Math.max(g.p1, g.p2);
      if (maxPts >= 9) labels.push("Match Point");
      return labels;
    }
    if (isTiebreak) {
      const diff = Math.abs(g.p1 - g.p2);
      const maxPts = Math.max(g.p1, g.p2);
      if (maxPts >= 6 && diff >= 1) labels.push("Set Point");
      return labels;
    }

    const SCORE = [0,15,30,40];
    const p1g = g.p1, p2g = g.p2;

    // 計算目前各方盤數
    const setsWon = { p1:0, p2:0 };
    allSets.forEach(s => { if(s.p1>s.p2) setsWon.p1++; else if(s.p2>s.p1) setsWon.p2++; });
    const setsNeeded = Math.ceil(maxSets / 2);

    // Break Point：接球方（非 server）在 40 以上且領先或平分後領先
    const receiver = server === "p1" ? "p2" : "p1";
    const rg = receiver === "p1" ? p1g : p2g;
    const sg = receiver === "p1" ? p2g : p1g;

    const isBreakPoint = !noAd
      ? (rg >= 3 && rg > sg) || (rg >= 3 && sg >= 3 && rg > sg)
      : (rg >= 3 && rg > sg);

    if (isBreakPoint) labels.push("Break Point");

    // Deuce
    if (!noAd && p1g >= 3 && p2g >= 3 && p1g === p2g) labels.push("Deuce");

    // Ad 分
    if (!noAd && p1g >= 3 && p2g >= 3 && p1g !== p2g) labels.push("Ad");

    // Set Point：任一方在 40 且局數領先差一局（含配合 Break Point）
    const checkSetPoint = (player) => {
      const pg = player === "p1" ? p1g : p2g;
      const og = player === "p1" ? p2g : p1g;
      const pcs = player === "p1" ? cs.p1 : cs.p2;
      const ocs = player === "p1" ? cs.p2 : cs.p1;
      const hasGameAdv = (pg >= 3 && pg > og) || (noAd && pg >= 3 && pg > og);
      const gamesPerSetVal = gamesPerSet ?? 6;
      const needsGames = pcs >= gamesPerSetVal - 1 && (pcs >= ocs + 1);
      return hasGameAdv && needsGames;
    };
    if (checkSetPoint("p1")) labels.push("Set Point");
    if (checkSetPoint("p2")) labels.push("Set Point");

    // Match Point
    const checkMatchPoint = (player) => {
      const pSets = player === "p1" ? setsWon.p1 : setsWon.p2;
      if (pSets < setsNeeded - 1) return false;
      return checkSetPoint(player);
    };
    if (checkMatchPoint("p1") || checkMatchPoint("p2")) {
      labels.push("Match Point");
      labels.splice(labels.indexOf("Set Point"), 1); // Match Point 取代 Set Point
    }

    return labels;
  };

  const finishPoint = useCallback((pt) => {
    // 在得分前計算關鍵分標籤
    const km = getKeyMoment(
      score.currentGame,
      score.currentSet,
      score.sets,
      server,
      format,
      score.tiebreak,
      superTiebreak
    );
    pt.keyMoments = km.length > 0 ? km : null;
    setPoints((prev) => [...prev, pt]);
    setCurrentPoint(null);
    setSelectedRallyShot(null);
    setNextHitter(null);
    setPendingErrorOutcome(null);
    setPendingServeType(null);
    setPendingServeLanding(null);
    setPendingRallyLanding(null);
    setPendingShotLanding(null);
    setPhase("serve1");

    const winner = pt.pointWinner;
    setScore((prev) => {
      const newScore = { ...prev, currentGame: { ...prev.currentGame }, currentSet: { ...prev.currentSet }, sets: [...prev.sets] };
      const { noAd, gamesPerSet, sets: maxSets, thirdSetSuper } = format;

      // 判斷是否在 Super Tiebreak
      let result;
      if (superTiebreak) {
        result = advanceSuperTiebreak({ ...prev.currentGame }, winner);
      } else if (prev.tiebreak) {
        result = advanceTiebreak({ ...prev.currentGame }, winner);
      } else {
        result = advanceGame({ ...prev.currentGame }, winner, noAd);
      }

      if (result.won) {
        if (superTiebreak) {
          // Super Tiebreak 結束 = 整場比賽結束
          newScore.sets = [...prev.sets, { p1: prev.currentSet.p1, p2: prev.currentSet.p2, super: true, superScore: { ...result.game } }];
          newScore.currentGame = { p1: 0, p2: 0 };
          setSuperTiebreak(false);
          setMatchOver(true);
          setMatchWinner(result.won);
          return newScore;
        }

        const setResult = advanceSet({ ...prev.currentSet }, result.won, prev.tiebreak, gamesPerSet);
        newScore.currentGame = result.game;

        if (setResult.won) {
          const completedSet = { p1: prev.currentSet.p1 + (result.won === "p1" ? 1 : 0), p2: prev.currentSet.p2 + (result.won === "p2" ? 1 : 0) };
          newScore.sets = [...prev.sets, completedSet];
          newScore.currentSet = setResult.newSet;
          newScore.tiebreak = false;

          const setsWon = { p1: 0, p2: 0 };
          newScore.sets.forEach((s) => { if (s.p1 > s.p2) setsWon.p1++; else setsWon.p2++; });
          const setsNeeded = maxSets === 1 ? 1 : Math.ceil(maxSets / 2);

          // 檢查是否進入第三盤 Super Tiebreak
          if (thirdSetSuper && setsWon.p1 === 1 && setsWon.p2 === 1) {
            setSuperTiebreak(true);
            newScore.currentGame = { p1: 0, p2: 0 };
          } else if (setsWon.p1 >= setsNeeded || setsWon.p2 >= setsNeeded) {
            const mw = setsWon.p1 >= setsNeeded ? "p1" : "p2";
            setMatchOver(true);
            setMatchWinner(mw);
            setSaveOnOver(true); // 觸發 useEffect 儲存
            return newScore;
          }
        } else {
          newScore.currentSet = setResult.newSet;
          newScore.tiebreak = setResult.tiebreak;
        }

        setServer((s) => (s === "p1" ? "p2" : "p1"));
        const nextSnap = { sets: newScore.sets, currentSet: newScore.currentSet, currentGame: newScore.currentGame };
        setCurrentPoint(createPoint(server === "p1" ? "p2" : "p1", nextSnap));

        // 奇數局結束換邊（計算目前完成的總局數）
        const totalGames = newScore.sets.reduce((a, s) => a + s.p1 + s.p2, 0)
          + newScore.currentSet.p1 + newScore.currentSet.p2;
        if (totalGames % 2 === 1) {
          setShowChangeSides(true);
          setP1Side(prev => prev === "south" ? "north" : "south");
        }
      } else {
        newScore.currentGame = result.game;
        const nextSnap = { sets: newScore.sets, currentSet: newScore.currentSet, currentGame: newScore.currentGame };
        setCurrentPoint(createPoint(server, nextSnap));
      }
      return newScore;
    });
  }, [server, format, superTiebreak, score]);

  // ── Stats computation ────────────────────────────────────────────────────
  const stats = (() => {
    const s = {
      p1: { points: 0, aces: 0, doubleFaults: 0, winners: 0, forcedErrors: 0, unforcedErrors: 0, fhErrors: 0, bhErrors: 0, serve1In: 0, serve1Total: 0, rally: 0 },
      p2: { points: 0, aces: 0, doubleFaults: 0, winners: 0, forcedErrors: 0, unforcedErrors: 0, fhErrors: 0, bhErrors: 0, serve1In: 0, serve1Total: 0, rally: 0 },
    };
    points.forEach((pt) => {
      const w = pt.pointWinner;
      const l = w === "p1" ? "p2" : "p1";
      s[w].points++;
      if (pt.pointEndReason === "ace") s[w].aces++;
      if (pt.pointEndReason === "double_fault") s[l].doubleFaults++;
      if (pt.serve1 !== null) { s[pt.server].serve1Total++; if (pt.serve1 === "in") s[pt.server].serve1In++; }
      s[pt.server].rally += pt.rallyCount;
      pt.rallyEvents.forEach((ev) => {
        if (ev.outcome === "winner") s[ev.shotBy].winners++;
        if (ev.outcome === "forced_error") {
          s[ev.shotBy].forcedErrors++; // shotBy 打出受迫失誤（失分方）
          if (ev.hand === "forehand") s[ev.shotBy].fhErrors++;
          if (ev.hand === "backhand") s[ev.shotBy].bhErrors++;
        }
        if (ev.outcome === "unforced_error") {
          s[ev.shotBy].unforcedErrors++;
          if (ev.hand === "forehand") s[ev.shotBy].fhErrors++;
          if (ev.hand === "backhand") s[ev.shotBy].bhErrors++;
        }
      });
    });
    return s;
  })();

  // ── History page ─────────────────────────────────────────────────────────
  if (showHistory && !historyMatch) {
    return (
      <div style={{ ...styles.app, padding:"0" }}>
        <div style={{ background:"rgba(255,255,255,0.03)", borderBottom:"1px solid rgba(255,255,255,0.08)", padding:"1rem 1rem 0.8rem", display:"flex", alignItems:"center", gap:"0.8rem" }}>
          <button onClick={() => setShowHistory(false)} style={{ background:"transparent", border:"none", color:"#7b9cff", fontSize:"1.2rem", cursor:"pointer", padding:"0.2rem" }}>←</button>
          <span style={{ color:"#e8eaf6", fontWeight:900, fontSize:"1rem" }}>📂 歷史記錄</span>
          <span style={{ color:"#444d6e", fontSize:"0.8rem", marginLeft:"auto" }}>{savedMatches.length} 場</span>
        </div>

        {/* 匯入JSON */}
        <div style={{ padding:"0.8rem 1rem", borderBottom:"1px solid rgba(255,255,255,0.05)" }}>
          <label style={{ display:"flex", alignItems:"center", gap:"0.5rem", cursor:"pointer", color:"#7b9cff", fontSize:"0.82rem", background:"rgba(123,156,255,0.08)", border:"1px solid rgba(123,156,255,0.25)", borderRadius:"8px", padding:"0.6rem 0.8rem" }}>
            📤 匯入 JSON 檔案
            <input type="file" accept=".json" style={{ display:"none" }} onChange={(e) => {
              const file = e.target.files[0];
              if (!file) return;
              const reader = new FileReader();
              reader.onload = (ev) => {
                try {
                  const data = JSON.parse(ev.target.result);

                  // 判斷是舊版還是新版格式
                  let record;
                  if (data.matchInfo && data.points) {
                    // 舊版格式：matchInfo + points，球員用名字而非p1/p2
                    const p1 = data.matchInfo.player1 ?? "球員A";
                    const p2 = data.matchInfo.player2 ?? "球員B";
                    const toKey = (name) => name === p1 ? "p1" : "p2";

                    // 重新計算每分的scoreSnapshot
                    const rebuildSnapshots = (rawPoints, formatLabel) => {
                      const SCORE_SEQ = [0,15,30,40];
                      let currentGame = { p1:0, p2:0 };
                      let currentSet  = { p1:0, p2:0 };
                      let sets = [];
                      let tiebreak = false;

                      // 簡單判斷賽制
                      const gamesPerSet = formatLabel?.includes("八局") ? 8 : 6;
                      const noAd = formatLabel?.includes("搶一");

                      return rawPoints.map(pt => {
                        const snap = {
                          sets: sets.map(s=>({...s})),
                          currentSet: {...currentSet},
                          currentGame: {...currentGame},
                        };

                        // 推進比分
                        const winner = pt.pointWinner === p1 ? "p1" : "p2";
                        if (tiebreak) {
                          currentGame[winner]++;
                          const diff = Math.abs(currentGame.p1 - currentGame.p2);
                          const max = Math.max(currentGame.p1, currentGame.p2);
                          if (max >= 7 && diff >= 2) {
                            currentSet[winner]++;
                            sets = [...sets, {...currentSet}];
                            currentSet = {p1:0,p2:0};
                            currentGame = {p1:0,p2:0};
                            tiebreak = false;
                          }
                        } else {
                          currentGame[winner]++;
                          const g = currentGame;
                          let gameWon = false;
                          if (noAd) {
                            if (g[winner] >= 3 && g[winner] > g[winner==="p1"?"p2":"p1"]) { gameWon=true; }
                            else if (g.p1 >= 3 && g.p2 >= 3) { if(g[winner]>g[winner==="p1"?"p2":"p1"]) gameWon=true; }
                          } else {
                            const other = winner==="p1"?"p2":"p1";
                            if (g[winner] >= 4 && g[winner]-g[other] >= 2) gameWon=true;
                          }
                          if (gameWon) {
                            currentSet[winner]++;
                            currentGame = {p1:0,p2:0};
                            // 判斷是否贏盤
                            const cs = currentSet;
                            const pw = winner, po = winner==="p1"?"p2":"p1";
                            const setWon = cs[pw] >= gamesPerSet && cs[pw]-cs[po] >= 2;
                            const tieBreakNeeded = cs.p1 === gamesPerSet && cs.p2 === gamesPerSet;
                            if (setWon) {
                              sets = [...sets, {...currentSet}];
                              currentSet = {p1:0,p2:0};
                            } else if (tieBreakNeeded) {
                              tiebreak = true;
                            }
                          }
                        }
                        return snap;
                      });
                    };

                    const snapshots = rebuildSnapshots(data.points ?? [], data.matchInfo.format);

                    const convertedPoints = (data.points ?? []).map((pt, idx) => ({
                      id: pt.index ?? Date.now() + Math.random(),
                      server: typeof pt.server === "string" && pt.server !== "p1" && pt.server !== "p2"
                        ? toKey(pt.server) : pt.server,
                      scoreSnapshot: snapshots[idx],
                      serve1: pt.serve1,
                      serve2: pt.serve2,
                      serveType: pt.serveType,
                      serveLanding: pt.serveLanding,
                      rallyCount: pt.rallyCount ?? 0,
                      pointWinner: typeof pt.pointWinner === "string" && pt.pointWinner !== "p1" && pt.pointWinner !== "p2"
                        ? toKey(pt.pointWinner) : pt.pointWinner,
                      pointEndReason: pt.pointEndReason,
                      videoTimestamp: pt.videoTimestamp ?? null,
                      timestamp: pt.timestamp ?? new Date().toISOString(),
                      rallyEvents: (pt.rallyEvents ?? []).map(ev => ({
                        shotBy: ev.shotBy ?? (ev.player ? toKey(ev.player) : null),
                        shotType: ev.shotType,
                        outcome: ev.outcome,
                        hand: ev.hand === "-" ? null : ev.hand,
                        landing: ev.landing ?? null,
                      })),
                    }));

                    record = {
                      id: Date.now(),
                      date: data.matchInfo.date ?? new Date().toLocaleDateString("zh-TW"),
                      time: "",
                      p1Name: p1,
                      p2Name: p2,
                      format: data.matchInfo.format ?? "-",
                      winner: data.matchInfo.winner ? toKey(data.matchInfo.winner) : null,
                      sets: data.matchInfo.sets ?? [],
                      points: convertedPoints,
                      imported: true,
                    };
                  } else if (data.points) {
                    // 新版格式
                    record = {
                      id: Date.now(),
                      date: data.match?.date ?? new Date().toLocaleDateString("zh-TW"),
                      time: "",
                      p1Name: data.match?.p1 ?? "球員A",
                      p2Name: data.match?.p2 ?? "球員B",
                      format: data.match?.format ?? "-",
                      winner: null,
                      sets: data.match?.sets ?? [],
                      points: data.points,
                      imported: true,
                    };
                  } else {
                    alert("無法識別的檔案格式");
                    return;
                  }

                  const updated = [record, ...savedMatches].slice(0, 50);
                  localStorage.setItem("tennis_matches", JSON.stringify(updated));
                  setSavedMatches(updated);
                  alert(`✅ 匯入成功！${record.p1Name} vs ${record.p2Name}，共 ${record.points.length} 分`);
                } catch(e) { alert("檔案讀取失敗：" + e.message); }
              };
              reader.readAsText(file);
              e.target.value = "";
            }} />
          </label>
        </div>

        {/* 比賽列表 */}
        <div style={{ padding:"0.5rem 1rem 2rem", overflowY:"auto" }}>
          {savedMatches.length === 0 && <p style={{ color:"#444d6e", textAlign:"center", marginTop:"2rem" }}>尚無歷史記錄</p>}
          {savedMatches.map((m, i) => (
            <div key={m.id ?? i}
              onClick={() => setHistoryMatch(m)}
              style={{ background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:"12px", padding:"0.8rem 1rem", marginBottom:"0.6rem", cursor:"pointer" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
                <div>
                  <div style={{ color:"#e8eaf6", fontWeight:700, fontSize:"0.9rem" }}>
                    {m.p1Name} <span style={{ color:"#444d6e" }}>vs</span> {m.p2Name}
                  </div>
                  <div style={{ color:"#444d6e", fontSize:"0.75rem", marginTop:"0.2rem" }}>
                    {m.date} {m.time} · {m.format}
                  </div>
                </div>
                <div style={{ textAlign:"right" }}>
                  {m.winner && <div style={{ color:"#00e5a0", fontSize:"0.78rem", fontWeight:700 }}>
                    🏆 {m.winner === "p1" ? m.p1Name : m.p2Name}
                  </div>}
                  <div style={{ color:"#7b9cff", fontSize:"0.75rem", marginTop:"0.2rem" }}>
                    {(m.sets ?? []).map(s => `${s.p1}-${s.p2}`).join(" ")}
                  </div>
                  <div style={{ color:"#444d6e", fontSize:"0.72rem" }}>{m.points?.length ?? 0} 分</div>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  // ── History match viewer ──────────────────────────────────────────────────
  if (showHistory && historyMatch) {
    const hm = historyMatch;
    const hmStats = (() => {
      const s = { p1:{ points:0,aces:0,doubleFaults:0,winners:0,forcedErrors:0,unforcedErrors:0,fhErrors:0,bhErrors:0 }, p2:{ points:0,aces:0,doubleFaults:0,winners:0,forcedErrors:0,unforcedErrors:0,fhErrors:0,bhErrors:0 } };
      (hm.points ?? []).forEach(pt => {
        if (pt.pointWinner) s[pt.pointWinner].points++;
        if (pt.pointEndReason === "ace") s[pt.server].aces++;
        if (pt.pointEndReason === "double_fault") s[pt.server].doubleFaults++;
        pt.rallyEvents?.forEach(ev => {
          if (ev.outcome === "winner") s[ev.shotBy].winners++;
          if (ev.outcome === "forced_error") { s[ev.shotBy].forcedErrors++; if(ev.hand==="forehand")s[ev.shotBy].fhErrors++; if(ev.hand==="backhand")s[ev.shotBy].bhErrors++; }
          if (ev.outcome === "unforced_error") { s[ev.shotBy].unforcedErrors++; if(ev.hand==="forehand")s[ev.shotBy].fhErrors++; if(ev.hand==="backhand")s[ev.shotBy].bhErrors++; }
        });
      });
      return s;
    })();

    return (
      <div style={{ ...styles.app }}>
        {/* 頂部導航 */}
        <div style={{ background:"rgba(255,255,255,0.03)", borderBottom:"1px solid rgba(255,255,255,0.08)", padding:"0.8rem 1rem", display:"flex", alignItems:"center", gap:"0.6rem" }}>
          <button onClick={() => setHistoryMatch(null)} style={{ background:"transparent", border:"none", color:"#7b9cff", fontSize:"1.1rem", cursor:"pointer" }}>←</button>
          <div style={{ flex:1 }}>
            <div style={{ color:"#e8eaf6", fontWeight:700, fontSize:"0.9rem" }}>{hm.p1Name} vs {hm.p2Name}</div>
            <div style={{ color:"#444d6e", fontSize:"0.72rem" }}>{hm.date} {hm.time} · {hm.format}</div>
          </div>
          {hm.winner && <div style={{ color:"#00e5a0", fontSize:"0.78rem", fontWeight:700 }}>🏆 {hm.winner==="p1"?hm.p1Name:hm.p2Name}</div>}
        </div>

        {/* 盤數 */}
        <div style={{ display:"flex", gap:"0.5rem", padding:"0.6rem 1rem", justifyContent:"center" }}>
          {(hm.sets ?? []).map((s,i) => (
            <span key={i} style={{ background:"rgba(123,156,255,0.1)", border:"1px solid rgba(123,156,255,0.25)", borderRadius:"6px", padding:"0.3rem 0.7rem", color:"#7b9cff", fontSize:"0.82rem", fontWeight:700 }}>
              {i+1}盤 {s.p1}-{s.p2}
            </span>
          ))}
        </div>

        {/* 分頁 */}
        <div style={styles.tabBar}>
          {[["replay","🎬 回放"],["stats","📊 統計"]].map(([id,label]) => (
            <button key={id} style={{ ...styles.tabBtn, ...(hmTab===id ? styles.tabBtnActive : {}) }} onClick={() => setHmTab(id)}>{label}</button>
          ))}
        </div>

        <div style={{ overflowY:"auto", flex:1 }}>
          {hmTab === "replay" && (
            <div style={styles.tabContent}>
              <ReplayPanel points={hm.points ?? []} p1Name={hm.p1Name} p2Name={hm.p2Name} />
            </div>
          )}
          {hmTab === "stats" && (
            <div style={styles.tabContent}>
              <StatsPanel stats={hmStats} p1Name={hm.p1Name} p2Name={hm.p2Name} points={hm.points ?? []} />
            </div>
          )}
        </div>

        {/* 刪除按鈕 */}
        <div style={{ padding:"0.8rem 1rem", borderTop:"1px solid rgba(255,255,255,0.06)" }}>
          <button onClick={() => {
            if (!confirm("確定刪除這場記錄？")) return;
            const updated = savedMatches.filter(m => m.id !== hm.id);
            localStorage.setItem("tennis_matches", JSON.stringify(updated));
            setSavedMatches(updated);
            setHistoryMatch(null);
          }} style={{ width:"100%", padding:"0.6rem", background:"rgba(255,107,107,0.08)", border:"1px solid rgba(255,107,107,0.3)", borderRadius:"8px", color:"#ff6b6b", cursor:"pointer", fontSize:"0.82rem", fontFamily:"inherit" }}>
            🗑 刪除這場記錄
          </button>
        </div>
      </div>
    );
  }

  // ── Setup page ───────────────────────────────────────────────────────────
  if (!matchStarted) {
    return (
      <div style={styles.setup}>
        <div style={styles.setupCard}>
          <div style={styles.courtIcon}>🎾</div>
          <h1 style={styles.title}>網球比賽記錄系統</h1>
          <p style={styles.subtitle}>單打 · 逐球追蹤 · 深度分析</p>
          <div style={styles.inputRow}>
            <div style={styles.inputGroup}>
              <label style={styles.label}>球員 1</label>
              <input style={styles.input} value={p1Name} onChange={(e) => setP1Name(e.target.value)} placeholder="球員 A" />
            </div>
            <div style={styles.vs}>VS</div>
            <div style={styles.inputGroup}>
              <label style={styles.label}>球員 2</label>
              <input style={styles.input} value={p2Name} onChange={(e) => setP2Name(e.target.value)} placeholder="球員 B" />
            </div>
          </div>
          <div style={styles.serverSelect}>
            <label style={styles.label}>賽制</label>
            <div style={{ display: "flex", flexDirection: "column", gap: "0.4rem", marginTop: "0.5rem" }}>
              {MATCH_FORMATS.map((f) => (
                <button key={f.id}
                  style={{ ...styles.toggleBtn, ...(format.id === f.id ? styles.toggleBtnActive : {}), textAlign: "left", padding: "0.6rem 1rem" }}
                  onClick={() => setFormat(f)}>
                  {format.id === f.id ? "✓ " : ""}{f.label}
                </button>
              ))}
            </div>
          </div>
          <div style={styles.serverSelect}>
            <label style={styles.label}>先發球員</label>
            <div style={styles.btnRow}>
              {["p1", "p2"].map((p) => (
                <button key={p} style={{ ...styles.toggleBtn, ...(server === p ? styles.toggleBtnActive : {}) }} onClick={() => setServer(p)}>
                  {playerName(p)}
                </button>
              ))}
            </div>
          </div>

          {/* 選邊 */}
          <div style={styles.serverSelect}>
            <label style={styles.label}>選邊（{p1Name} 站哪一側？）</label>
            <div style={{ display:"flex", gap:"0.5rem" }}>
              {[["south","南側 ↓"],["north","北側 ↑"]].map(([side, label]) => (
                <button key={side}
                  style={{ flex:1, padding:"0.55rem", borderRadius:"10px", border:`1.5px solid ${p1Side===side?"#00e5a0":"rgba(255,255,255,0.12)"}`, background: p1Side===side?"rgba(0,229,160,0.12)":"transparent", color: p1Side===side?"#00e5a0":"#555", cursor:"pointer", fontSize:"0.85rem", fontFamily:"inherit", fontWeight: p1Side===side?700:400 }}
                  onClick={() => setP1Side(side)}>
                  {label}
                </button>
              ))}
            </div>
            <div style={{ display:"flex", justifyContent:"space-between", marginTop:"0.4rem", padding:"0 0.2rem" }}>
              <span style={{ fontSize:"0.72rem", color: p1Side==="south"?"#00e5a0":"#f5a623" }}>
                {p1Side==="south" ? `↓ ${p1Name}` : `↓ ${p2Name}`}
              </span>
              <span style={{ fontSize:"0.72rem", color:"#444d6e" }}>球場方向</span>
              <span style={{ fontSize:"0.72rem", color: p1Side==="north"?"#00e5a0":"#f5a623" }}>
                {p1Side==="north" ? `↑ ${p1Name}` : `↑ ${p2Name}`}
              </span>
            </div>
          </div>
          <button style={styles.startBtn} onClick={startMatch}>開始比賽</button>
          <button
            style={{ ...styles.exportBtn, marginTop:"0.8rem", borderColor:"#7b9cff", color:"#7b9cff", width:"100%", padding:"0.7rem" }}
            onClick={() => setShowHistory(true)}>
            📂 歷史記錄{savedMatches.length > 0 ? `（${savedMatches.length} 場）` : ""}
          </button>
        </div>
      </div>
    );
  }

  if (matchOver) {
    return (
      <div style={styles.setup}>
        <div style={styles.setupCard}>
          <div style={styles.courtIcon}>🏆</div>
          <h1 style={styles.title}>比賽結束！</h1>
          <p style={{ ...styles.subtitle, color: "#00e5a0", fontSize: "1.4rem" }}>{playerName(matchWinner)} 獲勝</p>
          <p style={{ ...styles.subtitle, fontSize: "0.8rem", marginBottom: "0.5rem" }}>{format.label}</p>
          <div style={styles.setsDisplay}>
            {score.sets.map((s, i) => (
              <span key={i} style={styles.setBadge}>第{i + 1}盤 {s.p1}-{s.p2}</span>
            ))}
          </div>
          <div style={{ background:"rgba(0,229,160,0.08)", border:"1px solid rgba(0,229,160,0.2)", borderRadius:"8px", padding:"0.5rem 0.8rem", margin:"0.8rem 0", fontSize:"0.78rem", color:"#00e5a0" }}>
            ✅ 已自動儲存到歷史記錄
          </div>
          <button style={styles.startBtn} onClick={() => setShowStats(true)}>查看完整統計</button>
          <div style={{ display: "flex", gap: "0.6rem", marginTop: "0.8rem" }}>
            <button style={{ ...styles.exportBtn, borderColor: "#00e5a0", color: "#00e5a0" }} onClick={exportJSON}>⬇ JSON</button>
            <button style={{ ...styles.exportBtn, borderColor: "#f5a623", color: "#f5a623" }} onClick={exportCSV}>⬇ CSV</button>
            <button style={{ ...styles.exportBtn, borderColor: "#7b9cff", color: "#7b9cff" }}
              onClick={() => {
                setMatchStarted(false); setMatchOver(false); setShowStats(false);
                setPoints([]); setScore(initScore()); setSuperTiebreak(false);
              }}>🔁 新比賽</button>
          </div>
          {showStats && <StatsPanel stats={stats} p1Name={p1Name} p2Name={p2Name} points={points} />}
        </div>
      </div>
    );
  }

  return (
    <div style={styles.app}>
      {/* Header scoreboard */}
      <div style={styles.scoreboard}>
        <ScoreColumn name={p1Name} side="p1" score={score} stats={stats.p1} isServer={server === "p1"} />
        <div style={styles.scoreCenter}>
          <div style={styles.setsRow}>
            {score.sets.map((s, i) => <span key={i} style={styles.setNum}>{s.p1}-{s.p2}</span>)}
          </div>
          <div style={styles.gameScore}>{superTiebreak ? `Super TB: ${score.currentGame.p1}-${score.currentGame.p2}` : gameScoreLabel(score.currentGame, score.tiebreak, format.noAd)}</div>
          <div style={styles.setScore}>{score.currentSet.p1} — {score.currentSet.p2}</div>
          <div style={{ fontSize:"0.62rem", color:"#333d55", marginTop:"0.15rem" }}>
            {p1Side==="south" ? `↓${p1Name}` : `↓${p2Name}`} · {p1Side==="north" ? `↑${p1Name}` : `↑${p2Name}`}
          </div>
        </div>
        <ScoreColumn name={p2Name} side="p2" score={score} stats={stats.p2} isServer={server === "p2"} align="right" />
      </div>

      {/* 換邊提示 */}
      {showChangeSides && (
        <div style={{ margin:"0.8rem 1rem", background:"rgba(245,166,35,0.12)", border:"2px solid #f5a623", borderRadius:"16px", padding:"1.2rem", textAlign:"center" }}>
          <div style={{ fontSize:"1.8rem", marginBottom:"0.3rem" }}>🔄</div>
          <div style={{ color:"#f5a623", fontWeight:900, fontSize:"1.1rem", marginBottom:"0.5rem" }}>換邊！</div>
          <div style={{ color:"#e8eaf6", fontSize:"0.85rem", marginBottom:"0.8rem" }}>
            <div>{p1Name} 換到 <strong style={{ color:"#00e5a0" }}>{p1Side === "south" ? "南側 ↓" : "北側 ↑"}</strong></div>
            <div>{p2Name} 換到 <strong style={{ color:"#f5a623" }}>{p1Side === "south" ? "北側 ↑" : "南側 ↓"}</strong></div>
          </div>
          <button
            onClick={() => setShowChangeSides(false)}
            style={{ padding:"0.6rem 2rem", background:"#f5a623", border:"none", borderRadius:"10px", color:"#0a0f1e", fontWeight:900, fontSize:"1rem", cursor:"pointer", fontFamily:"inherit" }}>
            確認換邊，繼續比賽
          </button>
        </div>
      )}

      {/* Phase panel */}
      <div style={styles.phase}>
        {/* 發球落點選擇 */}
        {pendingServeLanding && currentPoint && (
          <PhasePanel title={`${pendingServeLanding.serveType} — 落點？`} color="#00e5a0">
            <ServeLandingPicker onSelect={handleServeLanding} server={currentPoint.server} totalPoints={points.length} gameScore={score.currentGame} points={points} />
            <button style={styles.backBtn} onClick={() => {
              setPendingServeLanding(null);
              setPendingServeType(currentPoint.serve2 === "in" ? "serve2in" : "serve1in");
            }}>← 重新選擇</button>
          </PhasePanel>
        )}

        {/* 發球球種選擇（進場或ACE後） */}
        {pendingServeType && !pendingServeLanding && currentPoint && (
          <PhasePanel
            title={pendingServeType.includes("ace") ? "⚡ ACE — 發球球種？" : "✓ 發球進場 — 球種？"}
            color={pendingServeType.startsWith("serve1") ? "#7b9cff" : "#f5a623"}
          >
            <div style={styles.btnGrid}>
              {SERVE_TYPES.map((st) => (
                <ActionBtn
                  key={st}
                  label={st}
                  color={pendingServeType.startsWith("serve1") ? "#7b9cff" : "#f5a623"}
                  onClick={() => handleServeTypeChoice(st)}
                />
              ))}
            </div>
            <button style={styles.backBtn} onClick={() => {
              setPendingServeType(null);
              setCurrentPoint((p) => ({ ...p, serve1: null, serve2: null }));
            }}>← 重新選擇</button>
          </PhasePanel>
        )}

        {!pendingServeType && !pendingServeLanding && !pendingRallyLanding && phase === "serve1" && currentPoint && (
          <PhasePanel title={`${playerName(currentPoint.server)} 第一發球`} color="#7b9cff">
            {/* Swing Vision 時間戳記 */}
            <div style={{ display:"flex", alignItems:"center", gap:"0.5rem", marginBottom:"0.8rem", background:"rgba(245,166,35,0.08)", border:"1px solid rgba(245,166,35,0.25)", borderRadius:"8px", padding:"0.5rem 0.8rem" }}>
              <span style={{ fontSize:"0.75rem", color:"#f5a623", whiteSpace:"nowrap" }}>🎬 影片時間</span>
              <input
                type="text"
                placeholder="02:35"
                maxLength={7}
                value={currentPoint.videoTimestamp ?? ""}
                onChange={(e) => setCurrentPoint((p) => ({ ...p, videoTimestamp: e.target.value }))}
                style={{ flex:1, background:"transparent", border:"none", outline:"none", color:"#e8eaf6", fontSize:"0.9rem", fontFamily:"inherit", textAlign:"center", letterSpacing:"0.05em" }}
              />
            </div>
            <div style={styles.btnGrid}>
              <ActionBtn label="✓ 第一發球進" color="#7b9cff" onClick={handleServe1In} />
              <ActionBtn label="⚡ ACE" color="#00e5a0" onClick={handleServe1Ace} />
              <ActionBtn label="✗ 失誤（第二發）" color="#ff6b6b" onClick={handleServe1Fault} />
            </div>
            {points.length > 0 && (
              <button style={styles.backBtn} onClick={undoLastPoint}>← 返回上一球</button>
            )}
          </PhasePanel>
        )}

        {!pendingServeType && !pendingServeLanding && !pendingRallyLanding && phase === "serve2" && currentPoint && (
          <PhasePanel title={`${playerName(currentPoint.server)} 第二發球`} color="#f5a623">
            <div style={styles.btnGrid}>
              <ActionBtn label="✓ 進球（繼續）" color="#7b9cff" onClick={handleServe2In} />
              <ActionBtn label="⚡ ACE" color="#00e5a0" onClick={handleServe2Ace} />
              <ActionBtn label="✗ Double Fault" color="#ff6b6b" onClick={handleDoubleFault} />
            </div>
            <button style={styles.backBtn} onClick={() => setPhase("serve1")}>← 返回第一發球</button>
          </PhasePanel>
        )}

        {!pendingServeType && !pendingServeLanding && !pendingRallyLanding && phase === "rally" && currentPoint && (
          <PhasePanel title={`對打中 · 已來回 ${currentPoint.rallyCount} 拍`} color="#00e5a0">
            {pendingErrorOutcome ? (
              <>
                <p style={styles.hint}>
                  <strong style={{ color: "#ff6b6b" }}>{playerName(pendingErrorOutcome.shotBy)}</strong>
                  　{pendingErrorOutcome.outcome.id === "unforced_error" ? "非受迫失誤" : "受迫失誤"}
                </p>
                <p style={{ ...styles.hint, marginTop: 0 }}>是正拍還是反拍失誤？</p>
                <div style={styles.btnGrid}>
                  <ActionBtn label="🎾 正拍" color="#00e5a0" onClick={() => handleHandChoice("forehand")} />
                  <ActionBtn label="🎾 反拍" color="#f5a623" onClick={() => handleHandChoice("backhand")} />
                </div>
                <button style={styles.backBtn} onClick={() => setPendingErrorOutcome(null)}>← 重新選擇</button>
              </>
            ) : pendingShotLanding ? (
              <>
                <p style={styles.hint}>
                  <strong style={{ color: "#00e5a0" }}>{playerName(pendingShotLanding.shotBy)}</strong> 的 <strong style={{ color: "#f5a623" }}>{pendingShotLanding.shotType}</strong> — 落點？
                </p>
                <RallyLandingPicker
                  onSelect={handleShotLanding}
                  hitter={pendingShotLanding.shotBy}
                  shotType={pendingShotLanding.shotType}
                  prevLanding={currentPoint.rallyEvents.length > 0
                    ? currentPoint.rallyEvents[currentPoint.rallyEvents.length - 1].landing
                    : currentPoint.serveLanding ?? null}
                  prevHitter={currentPoint.rallyEvents.length > 0
                    ? currentPoint.rallyEvents[currentPoint.rallyEvents.length - 1].shotBy
                    : currentPoint.server}
                  gameScore={score.currentGame}
                  p1Name={p1Name}
                  p2Name={p2Name}
                />
                <button style={styles.backBtn} onClick={() => { setPendingShotLanding(null); }}>← 重新選擇球種</button>
              </>
            ) : !selectedRallyShot ? (
              <>
                <p style={styles.hint}>
                  輪到 <strong style={{ color: "#00e5a0" }}>{playerName(nextHitter)}</strong> 擊球，選擇球種
                </p>
                <div style={styles.shotBtnsCenter}>
                  {SHOT_TYPES.map((st) => (
                    <button key={st} style={styles.shotBtn} onClick={() => startRallyShot(nextHitter, st)}>{st}</button>
                  ))}
                </div>
                <button style={styles.backBtn} onClick={() => {
                  if (currentPoint.rallyCount === 0) {
                    setPhase("serve1");
                    setCurrentPoint((p) => ({ ...p, serve1: null, serve2: null }));
                  } else {
                    const prevEvents = currentPoint.rallyEvents.slice(0, -1);
                    const lastShotBy = prevEvents.length > 0 ? prevEvents[prevEvents.length - 1].shotBy : currentPoint.server;
                    setCurrentPoint((p) => ({ ...p, rallyEvents: prevEvents, rallyCount: p.rallyCount - 1 }));
                    setNextHitter(lastShotBy === "p1" ? "p2" : "p1");
                  }
                }}>← {currentPoint && currentPoint.rallyCount === 0 ? "返回發球" : "撤回上一拍"}</button>
              </>
            ) : (
              <>
                <p style={styles.hint}>
                  <strong style={{ color: "#00e5a0" }}>{playerName(selectedRallyShot.shotBy)}</strong> 的 <strong style={{ color: "#f5a623" }}>{selectedRallyShot.shotType}</strong>
                </p>
                <p style={{ ...styles.hint, marginTop: 0 }}>結果如何？</p>
                <div style={styles.btnGrid}>
                  {OUTCOME_TYPES.map((o) => (
                    <ActionBtn key={o.id} label={o.label} color={o.color} onClick={() => handleRallyOutcome(o)} />
                  ))}
                </div>
                <button style={styles.backBtn} onClick={() => setSelectedRallyShot(null)}>← 重新選擇</button>
              </>
            )}
          </PhasePanel>
        )}
      </div>

      {/* Recent points log */}
      {/* 分頁導航 */}
      <div style={styles.tabBar}>
        {[
          { id: "record", label: "📋 紀錄" },
          { id: "stats",  label: "📊 統計" },
          { id: "replay", label: "🎬 回放" },
        ].map(t => (
          <button key={t.id} style={{ ...styles.tabBtn, ...(activeTab === t.id ? styles.tabBtnActive : {}) }}
            onClick={() => setActiveTab(t.id)}>{t.label}</button>
        ))}
      </div>

      <div style={styles.tabContent}>
        {activeTab === "record" && (
          <div>
            <div style={styles.logHeader}>
              <span style={{ color: "#7b9cff", fontSize: "0.85rem" }}>共 {points.length} 分</span>
              {points.length > 0 && (
                <button style={styles.undoBtn} onClick={undoLastPoint}>↩ 撤回上一分</button>
              )}
            </div>
            <div style={styles.pointList}>
              {[...points].reverse().map((pt, i) => (
                <PointRow key={pt.id} pt={pt} p1Name={p1Name} p2Name={p2Name} idx={points.length - i} />
              ))}
            </div>
          </div>
        )}
        {activeTab === "stats" && (
          <AnalyticsPanel stats={stats} points={points} p1Name={p1Name} p2Name={p2Name} />
        )}
        {activeTab === "replay" && (
          <ReplayPanel points={points} p1Name={p1Name} p2Name={p2Name} />
        )}
      </div>
    </div>
  );
}

// ── Sub-components ──────────────────────────────────────────────────────────
function ScoreColumn({ name, side, score, stats, isServer, align = "left" }) {
  return (
    <div style={{ ...styles.scoreCol, textAlign: align }}>
      <div style={styles.playerName}>
        {isServer && <span style={styles.serverDot}>●</span>}
        {name}
      </div>
      <div style={styles.pointsWon}>{stats.points}分</div>
    </div>
  );
}

function PhasePanel({ title, color, children }) {
  return (
    <div style={{ ...styles.panel, borderColor: color }}>
      <div style={{ ...styles.panelTitle, color }}>{title}</div>
      {children}
    </div>
  );
}

function ActionBtn({ label, color, onClick }) {
  return (
    <button style={{ ...styles.actionBtn, borderColor: color, color }} onClick={onClick}>
      {label}
    </button>
  );
}

function PointRow({ pt, p1Name, p2Name, idx }) {
  const pn = (p) => (p === "p1" ? p1Name : p2Name);
  const reasonMap = { ace: "ACE", double_fault: "雙重失誤", winner: "Winner", forced_error: "受迫失誤", unforced_error: "非受迫失誤" };
  return (
    <div style={styles.pointRow}>
      <span style={styles.pointIdx}>#{idx}</span>
      <span style={{ ...styles.pointWinner, color: "#00e5a0" }}>{pn(pt.pointWinner)} 得分</span>
      <span style={styles.pointReason}>{reasonMap[pt.pointEndReason] || pt.pointEndReason}</span>
      {pt.rallyCount > 0 && <span style={styles.pointRally}>來回{pt.rallyCount}拍</span>}
    </div>
  );
}

function StatsPanel({ stats, p1Name, p2Name, points }) {
  const avgRally = points.length ? (points.reduce((a, p) => a + p.rallyCount, 0) / points.length).toFixed(1) : 0;
  const rows = [
    ["總得分", stats.p1.points, stats.p2.points],
    ["ACE", stats.p1.aces, stats.p2.aces],
    ["雙重失誤", stats.p1.doubleFaults, stats.p2.doubleFaults],
    ["Winners", stats.p1.winners, stats.p2.winners],
    ["受迫失誤", stats.p1.forcedErrors, stats.p2.forcedErrors],
    ["非受迫失誤", stats.p1.unforcedErrors, stats.p2.unforcedErrors],
    ["　↳ 正拍失誤", stats.p1.fhErrors, stats.p2.fhErrors],
    ["　↳ 反拍失誤", stats.p1.bhErrors, stats.p2.bhErrors],
    ["第一發球進場率", stats.p1.serve1Total ? `${Math.round(stats.p1.serve1In / stats.p1.serve1Total * 100)}%` : "-", stats.p2.serve1Total ? `${Math.round(stats.p2.serve1In / stats.p2.serve1Total * 100)}%` : "-"],
  ];
  return (
    <div style={styles.statsPanel}>
      <div style={styles.statsTitle}>📊 比賽統計</div>
      <div style={styles.statsAvg}>平均每分來回：{avgRally} 拍</div>
      <div style={styles.statsHeader}>
        <span>{p1Name}</span><span>項目</span><span style={{ textAlign: "right" }}>{p2Name}</span>
      </div>
      {rows.map(([label, v1, v2]) => (
        <div key={label} style={styles.statsRow}>
          <span style={{ color: "#00e5a0", fontWeight: 700 }}>{v1}</span>
          <span style={styles.statsLabel}>{label}</span>
          <span style={{ color: "#f5a623", fontWeight: 700, textAlign: "right" }}>{v2}</span>
        </div>
      ))}
    </div>
  );
}

// ── Analytics Panel ──────────────────────────────────────────────────────────
function AnalyticsPanel({ stats, points, p1Name, p2Name }) {
  const [tab, setTab] = useState("shot"); // "shot" | "landing"
  const pn = (p) => p === "p1" ? p1Name : p2Name;

  // 球種統計
  const shotStats = {};
  points.forEach(pt => {
    pt.rallyEvents.forEach(ev => {
      if (!shotStats[ev.shotType]) shotStats[ev.shotType] = { winner: 0, forced: 0, unforced: 0, total: 0 };
      shotStats[ev.shotType].total++;
      if (ev.outcome === "winner") shotStats[ev.shotType].winner++;
      if (ev.outcome === "forced_error") shotStats[ev.shotType].forced++;
      if (ev.outcome === "unforced_error") shotStats[ev.shotType].unforced++;
    });
  });
  const shotList = Object.entries(shotStats).sort((a, b) => b[1].total - a[1].total);

  // 發球落點統計
  const serveLanding = { Wide: { p1: 0, p2: 0 }, Body: { p1: 0, p2: 0 }, T: { p1: 0, p2: 0 } };
  points.forEach(pt => {
    if (pt.serveLanding) {
      const key = pt.serveLanding;
      if (serveLanding[key]) serveLanding[key][pt.server]++;
    }
  });

  // 回球落點分佈（9宮格計數）
  const rallyGrid = {};
  const GRID_KEYS = ["net-L","net-M","net-R","mid-L","mid-M","mid-R","base-L","base-M","base-R"];
  GRID_KEYS.forEach(k => { rallyGrid[k] = { p1: 0, p2: 0 }; });
  points.forEach(pt => {
    pt.rallyEvents.forEach(ev => {
      if (ev.landing && rallyGrid[ev.landing]) {
        rallyGrid[ev.landing][ev.shotBy]++;
      }
    });
  });
  const maxRally = Math.max(1, ...GRID_KEYS.map(k => rallyGrid[k].p1 + rallyGrid[k].p2));

  // 9宮格SVG熱圖
  const W = 220, H = 200;
  const lx = 30, rx = W - 10, mx = (lx + rx) / 2;
  const netY = 18, serveLineY = 95, baseLineY = H - 15;
  const courtW = rx - lx, netZH = serveLineY - netY, midZH = 40, baseZH = baseLineY - serveLineY - midZH;
  const colW = courtW / 3;
  const rowDefs = [
    { y: netY,               h: netZH,  label: "網前" },
    { y: serveLineY,         h: midZH,  label: "中場" },
    { y: serveLineY + midZH, h: baseZH, label: "底線" },
  ];
  const gridZones = [
    { id:"net-L",  row:0, col:0 }, { id:"net-M",  row:0, col:1 }, { id:"net-R",  row:0, col:2 },
    { id:"mid-L",  row:1, col:0 }, { id:"mid-M",  row:1, col:1 }, { id:"mid-R",  row:1, col:2 },
    { id:"base-L", row:2, col:0 }, { id:"base-M", row:2, col:1 }, { id:"base-R", row:2, col:2 },
  ];
  const [heatPlayer, setHeatPlayer] = useState("both");
  const [serveTypeFilter, setServeTypeFilter] = useState("all");
  const [rallyTypeFilter, setRallyTypeFilter] = useState("all");
  const [landingSubTab, setLandingSubTab] = useState("serve");

  // 依球種篩選發球落點
  const filteredServeLanding = { Wide: { p1: 0, p2: 0 }, Body: { p1: 0, p2: 0 }, T: { p1: 0, p2: 0 } };
  points.forEach(pt => {
    if (!pt.serveLanding) return;
    if (serveTypeFilter !== "all" && pt.serveType !== serveTypeFilter) return;
    const key = pt.serveLanding;
    if (filteredServeLanding[key]) filteredServeLanding[key][pt.server]++;
  });

  // 依球種篩選回球落點
  const filteredRallyGrid = {};
  GRID_KEYS.forEach(k => { filteredRallyGrid[k] = { p1: 0, p2: 0 }; });
  points.forEach(pt => {
    pt.rallyEvents.forEach(ev => {
      if (!ev.landing || !filteredRallyGrid[ev.landing]) return;
      if (rallyTypeFilter !== "all" && ev.shotType !== rallyTypeFilter) return;
      filteredRallyGrid[ev.landing][ev.shotBy]++;
    });
  });
  const maxFiltered = Math.max(1, ...GRID_KEYS.map(k => filteredRallyGrid[k].p1 + filteredRallyGrid[k].p2));
  const usedShotTypes = [...new Set(points.flatMap(pt => pt.rallyEvents.map(ev => ev.shotType)))];

  return (
    <div style={{ paddingBottom: "1rem" }}>
      <div style={{ display: "flex", gap: "0.4rem", marginBottom: "0.8rem" }}>
        {[["shot","🎾 球種統計"],["landing","📍 落點分佈"]].map(([id, label]) => (
          <button key={id} onClick={() => setTab(id)}
            style={{ flex:1, padding:"0.45rem", background: tab===id ? "#7b9cff" : "rgba(255,255,255,0.04)", border:`1px solid ${tab===id ? "#7b9cff" : "rgba(255,255,255,0.1)"}`, borderRadius:"8px", color: tab===id ? "#0a0f1e" : "#7b9cff", fontWeight:700, cursor:"pointer", fontSize:"0.82rem", fontFamily:"inherit" }}>
            {label}
          </button>
        ))}
      </div>

      {tab === "shot" && (
        <div>
          {shotList.length === 0 && <p style={{ color:"#444d6e", textAlign:"center", fontSize:"0.85rem" }}>尚無資料</p>}
          {(() => {
            const totalShots = shotList.reduce((a, [, s]) => a + s.total, 0);
            return shotList.map(([shot, s]) => (
            <div key={shot} style={{ marginBottom:"0.6rem", background:"rgba(255,255,255,0.03)", borderRadius:"8px", padding:"0.6rem 0.8rem" }}>
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:"0.3rem" }}>
                <span style={{ color:"#e8eaf6", fontSize:"0.85rem", fontWeight:700 }}>{shot}</span>
                <span style={{ color:"#444d6e", fontSize:"0.78rem" }}>{s.total} 次 ({totalShots > 0 ? Math.round(s.total/totalShots*100) : 0}%)</span>
              </div>
              <div style={{ display:"flex", gap:"0.4rem" }}>
                {[
                  ["W","#00e5a0", s.winner, s.total > 0 ? Math.round(s.winner/s.total*100) : 0],
                  ["受","#f5a623", s.forced, s.total > 0 ? Math.round(s.forced/s.total*100) : 0],
                  ["非","#ff6b6b", s.unforced, s.total > 0 ? Math.round(s.unforced/s.total*100) : 0],
                ].map(([label, color, val, p]) => (
                  <span key={label} style={{ background:`${color}22`, border:`1px solid ${color}55`, borderRadius:"4px", padding:"0.1rem 0.5rem", color, fontSize:"0.75rem" }}>
                    {label} {val} <span style={{ opacity:0.7 }}>({p}%)</span>
                  </span>
                ))}
              </div>
              <div style={{ marginTop:"0.4rem", height:"4px", borderRadius:"2px", background:"rgba(255,255,255,0.06)", overflow:"hidden", display:"flex" }}>
                <div style={{ width:`${s.winner/s.total*100}%`, background:"#00e5a0" }}/>
                <div style={{ width:`${s.forced/s.total*100}%`, background:"#f5a623" }}/>
                <div style={{ width:`${s.unforced/s.total*100}%`, background:"#ff6b6b" }}/>
              </div>
            </div>
          ));
          })()}
        </div>
      )}

      {tab === "landing" && (
        <div>
          {/* 發球/擊球切換 */}
          <div style={{ display:"flex", gap:"0.4rem", marginBottom:"0.8rem" }}>
            {[["serve","🎾 發球落點"],["rally","🎾 擊球落點"]].map(([id, label]) => (
              <button key={id} onClick={() => setLandingSubTab(id)}
                style={{ flex:1, padding:"0.4rem", background: landingSubTab===id ? "#00e5a0" : "rgba(255,255,255,0.04)", border:`1px solid ${landingSubTab===id ? "#00e5a0" : "rgba(255,255,255,0.1)"}`, borderRadius:"8px", color: landingSubTab===id ? "#0a0f1e" : "#00e5a0", fontWeight:700, cursor:"pointer", fontSize:"0.8rem", fontFamily:"inherit" }}>
                {label}
              </button>
            ))}
          </div>

          {landingSubTab === "serve" && (
            <div>
              <div style={{ marginBottom:"0.6rem" }}>
                <div style={{ color:"#aab8d0", fontSize:"0.75rem", marginBottom:"0.4rem" }}>篩選發球種類</div>
                <div style={{ display:"flex", gap:"0.3rem", flexWrap:"wrap" }}>
                  {[["all","全部"], ...SERVE_TYPES.map(t => [t, t])].map(([v, label]) => (
                    <button key={v} onClick={() => setServeTypeFilter(v)}
                      style={{ padding:"0.3rem 0.6rem", background: serveTypeFilter===v ? "#7b9cff" : "rgba(255,255,255,0.04)", border:`1px solid ${serveTypeFilter===v ? "#7b9cff" : "rgba(255,255,255,0.15)"}`, borderRadius:"6px", color: serveTypeFilter===v ? "#0a0f1e" : "#aab8d0", fontSize:"0.75rem", cursor:"pointer", fontFamily:"inherit", fontWeight: serveTypeFilter===v ? 700 : 400 }}>
                      {label}
                    </button>
                  ))}
                </div>
              </div>
              {(() => {
                // 依球員、側別、落點統計
                const data = {
                  p1: { deuce: {Wide:0,Body:0,T:0,total:0}, ad: {Wide:0,Body:0,T:0,total:0} },
                  p2: { deuce: {Wide:0,Body:0,T:0,total:0}, ad: {Wide:0,Body:0,T:0,total:0} },
                };
                points.forEach((pt, idx) => {
                  if (!pt.serveLanding) return;
                  if (serveTypeFilter !== "all" && pt.serveType !== serveTypeFilter) return;
                  const side = pt.serveSide ?? (idx % 2 === 0 ? "deuce" : "ad");
                  const k = pt.serveLanding;
                  if (data[pt.server] && data[pt.server][side][k] !== undefined) {
                    data[pt.server][side][k]++;
                    data[pt.server][side].total++;
                  }
                });

                const W = 140, H = 190;
                const lx = 10, rx = W - 10, mx = W / 2;
                const netY = 30, serveLineY = 105, baseLineY = H - 22;

                const renderMiniCourt = (playerKey, side, isDeuceSide) => {
                  const d = data[playerKey][side];
                  const boxLx = isDeuceSide ? mx : lx;
                  const boxRx = isDeuceSide ? rx : mx;
                  const boxW = boxRx - boxLx;
                  const zoneW = boxW / 3;
                  const zoneY = serveLineY - 38, zoneH = 38;

                  const zones = isDeuceSide ? [
                    { id:"T",    label:"內", color:"rgba(195,175,15,0.82)", x: boxLx },
                    { id:"Body", label:"近", color:"rgba(35,155,65,0.82)",  x: boxLx + zoneW },
                    { id:"Wide", label:"外", color:"rgba(210,45,45,0.82)",  x: boxLx + zoneW*2 },
                  ] : [
                    { id:"Wide", label:"外", color:"rgba(210,45,45,0.82)",  x: boxLx },
                    { id:"Body", label:"近", color:"rgba(35,155,65,0.82)",  x: boxLx + zoneW },
                    { id:"T",    label:"內", color:"rgba(195,175,15,0.82)", x: boxLx + zoneW*2 },
                  ];

                  return (
                    <svg viewBox={`0 0 ${W} ${H}`} style={{ width:"100%", borderRadius:"8px", background:"#1a6b3a", display:"block" }}>
                      <rect x={lx} y={netY} width={rx-lx} height={baseLineY-netY} fill="#2980b9"/>
                      {zones.map(z => {
                        const cnt = d[z.id] ?? 0;
                        const pct = d.total > 0 ? Math.round(cnt/d.total*100) : 0;
                        return (
                          <g key={z.id}>
                            <rect x={z.x} y={zoneY} width={zoneW} height={zoneH} fill={z.color}/>
                            <text x={z.x+zoneW/2} y={zoneY+zoneH*0.3} textAnchor="middle" dominantBaseline="middle" fill="white" fontSize="7.5" fontWeight="bold">{z.label}</text>
                            <text x={z.x+zoneW/2} y={zoneY+zoneH*0.62} textAnchor="middle" dominantBaseline="middle" fill="white" fontSize="8.5" fontWeight="bold">{pct}%</text>
                            <text x={z.x+zoneW/2} y={zoneY+zoneH*0.88} textAnchor="middle" dominantBaseline="middle" fill="rgba(255,255,255,0.75)" fontSize="6.5">{cnt}次</text>
                          </g>
                        );
                      })}
                      {[1,2].map(i => <line key={i} x1={boxLx+zoneW*i} y1={zoneY} x2={boxLx+zoneW*i} y2={serveLineY} stroke="rgba(255,255,255,0.5)" strokeWidth="1"/>)}
                      <line x1={lx} y1={baseLineY} x2={rx} y2={baseLineY} stroke="white" strokeWidth="1.5"/>
                      <line x1={lx} y1={serveLineY} x2={rx} y2={serveLineY} stroke="white" strokeWidth="1.2"/>
                      <line x1={lx} y1={netY} x2={rx} y2={netY} stroke="white" strokeWidth="2.5"/>
                      <line x1={lx} y1={netY} x2={lx} y2={baseLineY} stroke="white" strokeWidth="1.5"/>
                      <line x1={rx} y1={netY} x2={rx} y2={baseLineY} stroke="white" strokeWidth="1.5"/>
                      <line x1={mx} y1={netY} x2={mx} y2={serveLineY} stroke="white" strokeWidth="1.2"/>
                      <text x={mx} y={netY-4} textAnchor="middle" fill="white" fontSize="7">網</text>
                      <text x={(lx+mx)/2} y={serveLineY+11} textAnchor="middle" fill="rgba(255,255,255,0.4)" fontSize="7">{isDeuceSide ? "Ad" : "Deuce"}</text>
                      <text x={(mx+rx)/2} y={serveLineY+11} textAnchor="middle" fill="rgba(255,255,255,0.4)" fontSize="7">{isDeuceSide ? "Deuce" : "Ad"}</text>
                      {/* 側別標示 */}
                      <rect x={lx} y={baseLineY+3} width={rx-lx} height={14} fill={isDeuceSide ? "rgba(123,156,255,0.25)" : "rgba(245,166,35,0.25)"} rx="2"/>
                      <text x={(lx+rx)/2} y={baseLineY+11} textAnchor="middle" dominantBaseline="middle" fill={isDeuceSide ? "#7b9cff" : "#f5a623"} fontSize="7.5" fontWeight="bold">{isDeuceSide ? "Deuce 側" : "Ad 側"} ({d.total}次)</text>
                    </svg>
                  );
                };

                return (
                  <div>
                    {[["p1", p1Name, "#00e5a0"], ["p2", p2Name, "#f5a623"]].map(([pk, pname, pcolor]) => (
                      <div key={pk} style={{ marginBottom:"0.8rem" }}>
                        <div style={{ color: pcolor, fontSize:"0.82rem", fontWeight:700, marginBottom:"0.4rem" }}>
                          {pname} — 發球落點
                        </div>
                        <div style={{ display:"flex", gap:"0.4rem" }}>
                          <div style={{ flex:1 }}>{renderMiniCourt(pk, "deuce", true)}</div>
                          <div style={{ flex:1 }}>{renderMiniCourt(pk, "ad", false)}</div>
                        </div>
                      </div>
                    ))}
                    {/* 圖例 */}
                    <div style={{ display:"flex", gap:"0.6rem", justifyContent:"center", marginTop:"0.3rem" }}>
                      {[["外角","#e03333"],["近身","#28a046"],["內角","#c8b820"]].map(([label,color]) => (
                        <span key={label} style={{ fontSize:"0.72rem", color, display:"flex", alignItems:"center", gap:"0.2rem" }}>
                          <span style={{ width:"8px", height:"8px", borderRadius:"2px", background:color, display:"inline-block" }}/>
                          {label}
                        </span>
                      ))}
                    </div>
                  </div>
                );
              })()}
            </div>
          )}

          {landingSubTab === "rally" && (
            <div>
              <div style={{ display:"flex", justifyContent:"flex-end", gap:"0.3rem", marginBottom:"0.5rem" }}>
                {[["both","雙方"],["p1",p1Name],["p2",p2Name]].map(([v, label]) => (
                  <button key={v} onClick={() => setHeatPlayer(v)}
                    style={{ padding:"0.2rem 0.5rem", background: heatPlayer===v ? "#7b9cff" : "transparent", border:"1px solid rgba(123,156,255,0.3)", borderRadius:"4px", color: heatPlayer===v ? "#0a0f1e" : "#7b9cff", fontSize:"0.7rem", cursor:"pointer", fontFamily:"inherit" }}>
                    {label}
                  </button>
                ))}
              </div>
              <div style={{ marginBottom:"0.6rem" }}>
                <div style={{ color:"#aab8d0", fontSize:"0.75rem", marginBottom:"0.4rem" }}>篩選擊球種類</div>
                <div style={{ display:"flex", gap:"0.3rem", flexWrap:"wrap" }}>
                  {[["all","全部"], ...usedShotTypes.map(t => [t, t])].map(([v, label]) => (
                    <button key={v} onClick={() => setRallyTypeFilter(v)}
                      style={{ padding:"0.3rem 0.6rem", background: rallyTypeFilter===v ? "#00e5a0" : "rgba(255,255,255,0.04)", border:`1px solid ${rallyTypeFilter===v ? "#00e5a0" : "rgba(255,255,255,0.15)"}`, borderRadius:"6px", color: rallyTypeFilter===v ? "#0a0f1e" : "#aab8d0", fontSize:"0.72rem", cursor:"pointer", fontFamily:"inherit", fontWeight: rallyTypeFilter===v ? 700 : 400 }}>
                      {label}
                    </button>
                  ))}
                </div>
              </div>
              <svg viewBox={`0 0 ${W} ${H}`} style={{ width:"100%", borderRadius:"10px", background:"#1a6b3a", display:"block" }}>
                <rect x={lx} y={netY} width={courtW} height={baseLineY-netY} fill="#2980b9"/>
                {gridZones.map(z => {
                  const row = rowDefs[z.row];
                  const x = lx + z.col * colW, y = row.y, w = colW, h = row.h;
                  const count = heatPlayer === "both"
                    ? filteredRallyGrid[z.id].p1 + filteredRallyGrid[z.id].p2
                    : filteredRallyGrid[z.id][heatPlayer];
                  const intensity = count / maxFiltered;
                  const alpha = count > 0 ? 0.15 + intensity * 0.75 : 0.05;
                  return (
                    <g key={z.id}>
                      <rect x={x} y={y} width={w} height={h} fill={`rgba(255,80,80,${alpha})`}/>
                      <text x={x+w/2} y={y+h/2} textAnchor="middle" dominantBaseline="middle" fill="white" fontSize="11" fontWeight="bold">{count || ""}</text>
                    </g>
                  );
                })}
                <line x1={lx} y1={baseLineY} x2={rx} y2={baseLineY} stroke="white" strokeWidth="2"/>
                <line x1={lx} y1={serveLineY} x2={rx} y2={serveLineY} stroke="white" strokeWidth="1.5"/>
                <line x1={lx} y1={netY} x2={rx} y2={netY} stroke="white" strokeWidth="3"/>
                <line x1={lx} y1={netY} x2={lx} y2={baseLineY} stroke="white" strokeWidth="2"/>
                <line x1={rx} y1={netY} x2={rx} y2={baseLineY} stroke="white" strokeWidth="2"/>
                <line x1={mx} y1={netY} x2={mx} y2={serveLineY} stroke="white" strokeWidth="1.5"/>
                {[1,2].map(i => <line key={i} x1={lx+colW*i} y1={netY} x2={lx+colW*i} y2={baseLineY} stroke="rgba(255,255,255,0.3)" strokeWidth="1" strokeDasharray="3,3"/>)}
                <line x1={lx} y1={serveLineY+midZH} x2={rx} y2={serveLineY+midZH} stroke="rgba(255,255,255,0.3)" strokeWidth="1" strokeDasharray="3,3"/>
                {rowDefs.map((r,i) => <text key={i} x={lx-3} y={r.y+r.h/2} textAnchor="end" dominantBaseline="middle" fill="white" fontSize="7" opacity="0.8">{r.label}</text>)}
                <text x={mx} y={netY-4} textAnchor="middle" fill="white" fontSize="8">網</text>
              </svg>
              <div style={{ display:"flex", alignItems:"center", gap:"0.4rem", marginTop:"0.4rem" }}>
                <span style={{ fontSize:"0.7rem", color:"#444d6e" }}>少</span>
                <div style={{ flex:1, height:"6px", borderRadius:"3px", background:"linear-gradient(to right, rgba(255,80,80,0.15), rgba(255,80,80,0.85))" }}/>
                <span style={{ fontSize:"0.7rem", color:"#444d6e" }}>多</span>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}


// ── Replay Panel ──────────────────────────────────────────────────────────────
function ReplayPanel({ points, p1Name, p2Name }) {
  const [selected, setSelected] = useState(null);
  const [mode, setMode] = useState("all"); // "all" | "key"
  const [keyFilter, setKeyFilter] = useState(null);
  const pn = (p) => p === "p1" ? p1Name : p2Name;
  const reasonMap = { ace:"ACE", double_fault:"雙重失誤", winner:"Winner", forced_error:"受迫失誤", unforced_error:"非受迫失誤" };
  const handMap = { forehand:"正拍", backhand:"反拍" };
  const landingMap = { "net-L":"網前左","net-M":"網前中","net-R":"網前右","mid-L":"中場左","mid-M":"中場中","mid-R":"中場右","base-L":"底線左","base-M":"底線中","base-R":"底線右" };
  const serveMap = { Wide:"外角", Body:"近身", T:"內角" };
  const SCORE_SEQ = ["0", "15", "30", "40"];

  const KEY_TYPES = [
    { id:"Break Point",  label:"Break Point",  color:"#ff6b6b" },
    { id:"Set Point",    label:"Set Point",    color:"#f5a623" },
    { id:"Match Point",  label:"Match Point",  color:"#00e5a0" },
    { id:"Deuce",        label:"Deuce",        color:"#7b9cff" },
    { id:"Ad",           label:"Ad 分",        color:"#c77dff" },
  ];

  const keyCounts = {};
  KEY_TYPES.forEach(k => {
